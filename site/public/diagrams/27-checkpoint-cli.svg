<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 192" role="img"><title>同一个 CLI 的两条接线</title><rect width="640" height="192" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="18" y="30" font-size="21" font-weight="700">同一个 CLI 的两条接线</text><rect x="18" y="48" width="604" height="52" rx="8" fill="#e0edfc"/><text x="32" y="69" font-size="18" font-weight="700">正常运行 + --checkpoint</text><text x="32" y="90" font-size="15">模型修改结束后保存检查点并退出</text><path d="M320 102v8l-4-4m4 4l4-4" fill="none" stroke="#476783"/><rect x="18" y="112" width="604" height="52" rx="8" fill="#e0f1e9"/><text x="32" y="133" font-size="18" font-weight="700">--task + --resume-check</text><text x="32" y="154" font-size="15">加载可信任务配置后直接接续验收</text></g></svg>
