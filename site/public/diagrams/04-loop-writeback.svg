<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-label="runAgent：一轮怎样改变 messages"><rect width="900" height="356" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="42" font-size="25" font-weight="700">runAgent：一轮怎样改变 messages</text><rect x="28" y="62" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="93" font-size="21" font-weight="700">开始：1 条消息</text><text x="48" y="122" font-size="18">应用提供用户任务；Runtime 持有本次记录数组。</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">收到工具请求：2 条消息</text><text x="48" y="216" font-size="18">messages.push(message) 保存完整模型消息。</text><rect x="28" y="250" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="281" font-size="21" font-weight="700">单项工具完成：3 条消息</text><text x="48" y="310" font-size="18">messages.push(...results) 保存反馈；下一轮用更新后的记录。</text></g></svg>
