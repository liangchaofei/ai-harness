<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1090" viewBox="0 0 1080 1090" role="img" aria-labelledby="title desc">
<title id="title">应用只启动一次，Runtime 根据响应自动推进</title><desc id="desc">图中按职责说明控制流；模型服务仍由应用传入的函数接入。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1080" height="1090" fill="#f8fafc"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="28" font-weight="700">应用只启动一次，Runtime 根据响应自动推进</text>
<text x="40" y="86" font-size="19" fill="#475569">图中按职责说明控制流；模型服务仍由应用传入的函数接入。</text>
<rect x="40" y="118" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="152" font-size="23" font-weight="700">应用组装并调用 runAgent</text>
<text x="62" y="185" font-size="20">传入初始消息、总体要求、工具、callModel 与 maxModelCalls。</text>
<text x="62" y="215" font-size="20">Runtime 复制初始数组，建立本次 messages，计数从 0 开始。</text>
<path d="M 540 247 L 540 264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="268" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="302" font-size="23" font-weight="700">Runtime 调用应用注入的模型函数</text>
<text x="62" y="335" font-size="20">次数加 1 → 用最新记录创建 Context → await callModel(context)。</text>
<text x="62" y="365" font-size="20">应用函数调用 complete；服务响应转换后，Runtime 接住为 message。</text>
<path d="M 540 397 L 540 414" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="418" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="452" font-size="23" font-weight="700">Runtime 先保存响应，再判断是否停止</text>
<text x="62" y="485" font-size="20">messages.push(message)。length → truncated；空白 stop → emptyAnswer。</text>
<text x="62" y="515" font-size="20">非空 stop → answered；未知模型异常 → failed / model。</text>
<path d="M 540 547 L 540 564" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="568" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="602" font-size="23" font-weight="700">仍是工具请求：检查是否还有后续模型调用次数</text>
<text x="62" y="635" font-size="20">已达上限 → callLimit；保留请求，不执行本批工具。</text>
<text x="62" y="665" font-size="20">还有次数 → executeTools，沿用03的顺序执行和参数检查。</text>
<path d="M 540 697 L 540 714" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="718" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="752" font-size="23" font-weight="700">完整批次返回：Runtime 保存反馈并继续</text>
<text x="62" y="785" font-size="20">messages.push(...results)，原 assistant 保存一次，每项反馈分别关联原 ID。</text>
<text x="62" y="815" font-size="20">回到“调用模型函数”：下一次带更新后的记录；未知工具异常 → failed / tools。</text>
<rect x="40" y="868" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="902" font-size="23" font-weight="700">各停止分支：return RunResult → 应用 const result</text>
<text x="62" y="935" font-size="20">应用展示记录与停止原因，检查目标源码的成功读取证据。</text>
<text x="62" y="965" font-size="20">answered 只是得到回答；是否指出真实问题仍需核对。</text>
<path d="M 1040 781 L 1060 781 L 1060 331 L 1040 331" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="1038" font-size="18" fill="#475569">本篇没有后台重试、并发、持久化或取消；第二阶段继续扩展运行控制。</text></g></svg>