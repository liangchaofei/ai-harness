<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="940" viewBox="0 0 1080 940" role="img" aria-labelledby="title desc">
<title id="title">同一个 toolu_read_01：从请求到反馈</title><desc id="desc">协议结构示意；多项结果的合并只发生在发送数组，不改变 Runtime 记录。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1080" height="940" fill="#f8fafc"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="28" font-weight="700">同一个 toolu_read_01：从请求到反馈</text>
<text x="40" y="86" font-size="19" fill="#475569">协议结构示意；多项结果的合并只发生在发送数组，不改变 Runtime 记录。</text>
<rect x="40" y="118" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="152" font-size="23" font-weight="700">1．Runtime → callModel → completeAnthropic</text>
<text x="62" y="185" font-size="20">输入 Context：用户任务、总体要求、工具说明；本地选择同一套适配代码。</text>
<text x="62" y="215" font-size="20">encodeAnthropicMessages：用户文本 → text 块；请求函数另加 system / tools。</text>
<path d="M 540 247 L 540 264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="268" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="302" font-size="23" font-weight="700">2．HTTP 响应 → decodeAnthropicMessage → Runtime</text>
<text x="62" y="335" font-size="20">服务块：tool_use / toolu_read_01 / read_file / input = {path: src/cart.ts}。</text>
<text x="62" y="365" font-size="20">项目消息：toolUse；参数变为 JSON 字符串；原 ID 不变，仍未执行。</text>
<path d="M 540 397 L 540 414" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="418" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="452" font-size="23" font-weight="700">3．原执行器读取文件，Runtime 保存结果</text>
<text x="62" y="485" font-size="20">messages.push(message)；executeTools → read_file → 实际源码。</text>
<text x="62" y="515" font-size="20">messages.push(...results)：保存 toolCallId = toolu_read_01 / isError = false。</text>
<path d="M 540 547 L 540 564" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="568" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="602" font-size="23" font-weight="700">4．下一次输入 → encodeAnthropicMessages</text>
<text x="62" y="635" font-size="20">assistant 历史还原为 tool_use 块；结果变成 user 中的 tool_result 块。</text>
<text x="62" y="665" font-size="20">tool_use_id = toolu_read_01；content 为实际源码，is_error = false。</text>

<rect x="40" y="718" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="752" font-size="23" font-weight="700">批次编码：四条项目记录 → 三条服务消息</text>
<text x="62" y="785" font-size="20">[用户，含 one/two 的 assistant，one 结果，two 结果]</text>
<text x="62" y="815" font-size="20">→ [user 文本，assistant 两项 tool_use，user 两项 tool_result]。</text>
<text x="40" y="888" font-size="18" fill="#475569">已知停止映射后由原循环判断；未知停止或内容块抛出，不能当作任务回答。</text></g></svg>