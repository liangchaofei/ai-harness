<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 211" role="img" aria-labelledby="title"><title id="title">验收子进程怎样留下证据</title><rect width="600" height="211" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="32" font-size="22" font-weight="700">验收子进程怎样留下证据</text><rect x="20" y="48" width="560" height="40" rx="8" fill="#e0edfc"/><text x="34" y="74" font-size="17">.probe-started → 脚本已经启动</text><rect x="20" y="100" width="560" height="40" rx="8" fill="#e0f1e9"/><text x="34" y="126" font-size="17">等 .probe-release → 执行原路径验收</text><rect x="20" y="152" width="560" height="40" rx="8" fill="#fff0d9"/><text x="34" y="178" font-size="17">把 process.exitCode 写入 .probe-finished</text></g></svg>
