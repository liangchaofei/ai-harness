<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title desc">
<title id="title">同一循环：一次路径失败后，三次调用得到回答</title><desc id="desc">教学样本；作者固定响应已验证此程序路径，不代表真实模型必然这样选择。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1080" height="790" fill="#f8fafc"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="28" font-weight="700">同一循环：一次路径失败后，三次调用得到回答</text>
<text x="40" y="86" font-size="19" fill="#475569">教学样本；作者固定响应已验证此程序路径，不代表真实模型必然这样选择。</text>
<rect x="40" y="118" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="152" font-size="23" font-weight="700">调用 1：输入只有 1 条记录</text>
<text x="62" y="185" font-size="20">[用户任务] → 模型请求 bad_01 / read_file / cart.ts。</text>
<text x="62" y="215" font-size="20">Runtime 保存请求；路径不在允许清单，保存 isError = true 的结果。</text>
<path d="M 540 247 L 540 264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="268" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="302" font-size="23" font-weight="700">调用 2：输入有 3 条记录</text>
<text x="62" y="335" font-size="20">[用户，bad_01 请求，bad_01 失败结果] → 模型提出新请求 read_02。</text>
<text x="62" y="365" font-size="20">read_02 / read_file / src/cart.ts；读取成功，结果仍关联 read_02。</text>
<path d="M 540 397 L 540 414" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="418" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="452" font-size="23" font-weight="700">调用 3：输入有 5 条记录</text>
<text x="62" y="485" font-size="20">[用户，bad_01 请求及结果，read_02 请求及实际源码结果]。</text>
<text x="62" y="515" font-size="20">模型正常返回审查文字；Runtime 保存后，共有 6 条记录。</text>
<path d="M 540 547 L 540 564" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="568" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="602" font-size="23" font-weight="700">停止结果：answered / modelCalls = 3</text>
<text x="62" y="635" font-size="20">应用收到完整记录和回答；成功读取证据与具体计算结论分别核对。</text>
<text x="62" y="665" font-size="20">若模型一直请求工具，可能触发 callLimit；不会自动视为任务成功。</text>
<text x="40" y="738" font-size="18" fill="#475569">以上记录数不含总体要求；模型包在各次 HTTP 输入前另加 system 消息。</text></g></svg>