<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" role="img" aria-label="从原始验收反馈得到两条事实"><rect width="900" height="354" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="44" font-size="26" font-weight="700">从原始验收反馈得到两条事实</text><rect x="28" y="63" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="94" font-size="21" font-weight="700">omitted：check_partial</text><text x="48" y="123" font-size="18">从被省略的原反馈提取失败用例 /，记录 index 和工具请求 ID。</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">latest：check_complete</text><text x="48" y="216" font-size="18">记录最近一次实际验收；当时通过，不等于当前文件通过。</text><rect x="28" y="249" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="280" font-size="21" font-weight="700">后续写入 → needsRecheck</text><text x="48" y="309" font-size="18">重新读取完整历史计算状态，不复用上一轮摘要的结论。</text></g></svg>
