<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="验收失败不是终点，旧验收也不是当前证明"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="520" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">验收失败不是终点，旧验收也不是当前证明</text><text x="32" y="72" font-size="15" fill="#52667d">左侧：模型下一轮获得实际反馈；右侧：应用停止后独立核对当前内容。</text><path d="M450 155L510 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 225L710 310" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M510 355L450 355" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="32" y="108" width="418" height="102" rx="10" fill="#fff0d3" stroke="#bac9d9"/><text x="48" y="138" font-size="16" fill="#182c45">1  run_check实际执行公开入口</text><text x="48" y="160" font-size="16" fill="#182c45">工具处理成功：isError = false</text><text x="48" y="182" font-size="16" fill="#182c45">业务失败：input / → actual 空字符串</text><rect x="510" y="108" width="418" height="102" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="526" y="138" font-size="16" fill="#182c45">2  Runtime按请求ID保存反馈</text><text x="526" y="160" font-size="16" fill="#182c45">下一轮Context包含实际失败</text><text x="526" y="182" font-size="16" fill="#182c45">模型决定修正、继续调查或说明限制</text><rect x="32" y="310" width="418" height="102" rx="10" fill="#e4f4eb" stroke="#bac9d9"/><text x="48" y="340" font-size="16" fill="#182c45">4  reportSession再次inspect</text><text x="48" y="362" font-size="16" fill="#182c45">当前内容对应最近验收才可接受</text><text x="48" y="384" font-size="16" fill="#182c45">无修改 / 未验收 / 旧证据 → 拒绝</text><rect x="510" y="310" width="418" height="102" rx="10" fill="#fff0d3" stroke="#bac9d9"/><text x="526" y="340" font-size="16" fill="#182c45">3  修改并重新验收</text><text x="526" y="362" font-size="16" fill="#182c45">通过后再改注释：内容标识改变</text><text x="526" y="384" font-size="16" fill="#182c45">最近passed ≠ 当前已验收</text><text x="32" y="496" font-size="15" fill="#52667d">任务接受还需正常回答、允许的非空变化、进程通过和业务passed:true。</text></g></svg>