<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#64748b"/></marker></defs><rect width="1080" height="720" fill="#f8fafc"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="44" font-size="25" font-weight="700" fill="#172554">第01篇：应用通过模型包取得assistant消息</text><text x="30" y="78" font-size="16" fill="#475569">实线框为本篇；虚线框为后续。借鉴Pi的职责边界，保留停止原因，由应用判断能否交付。</text><path d="M330 220 L385 220" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M690 220 L745 220" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M900 330 L900 395" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="140" width="300" height="190" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" /><text x="48" y="172" font-size="19" font-weight="700" fill="#0f172a">代码审查示例</text><text x="48" y="204" font-size="16" fill="#334155">main.ts创建Context</text><text x="48" y="231" font-size="16" fill="#334155">读取凭据和生成配置</text><text x="48" y="258" font-size="16" fill="#334155">通过包入口调用complete</text><text x="48" y="285" font-size="16" fill="#334155">判断stopReason，再展示文本</text><rect x="390" y="140" width="300" height="190" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" /><text x="408" y="172" font-size="19" font-weight="700" fill="#0f172a">模型接入包</text><text x="408" y="204" font-size="16" fill="#334155">types.ts：输入输出契约</text><text x="408" y="231" font-size="16" fill="#334155">index.ts：只导出公开能力</text><text x="408" y="258" font-size="16" fill="#334155">providers/deepseek.ts：转换</text><text x="408" y="285" font-size="16" fill="#334155">返回AssistantMessage</text><rect x="750" y="140" width="300" height="190" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" /><text x="768" y="172" font-size="19" font-weight="700" fill="#0f172a">远程模型服务</text><text x="768" y="204" font-size="16" fill="#334155">收到两条messages</text><text x="768" y="231" font-size="16" fill="#334155">返回assistant及finish_reason</text><text x="768" y="258" font-size="16" fill="#334155">可以stop，也可以length</text><text x="768" y="285" font-size="16" fill="#334155">没有自动取得本地磁盘权限</text><rect x="30" y="400" width="1020" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" /><text x="48" y="432" font-size="19" font-weight="700" fill="#0f172a">返回：服务JSON → decodeMessage → message → 应用判断</text><text x="48" y="464" font-size="16" fill="#334155">保留stop / length；截断与网络失败分开；正常停止仍不证明结论正确</text><rect x="30" y="555" width="1020" height="125" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/><text x="48" y="587" font-size="19" font-weight="700" fill="#0f172a">后续Runtime与Harness：本篇尚未实现</text><text x="48" y="619" font-size="16" fill="#334155">Runtime组织多轮请求、工具执行与状态变化，继续使用模型接入包</text><text x="48" y="646" font-size="16" fill="#334155">Pi的流式事件、提供商集合、完整消息块和错误机制按阶段理解，本篇不声称已复刻</text></g></svg>