<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title"><title id="title">报告层什么时候调用写入</title><rect width="600" height="280" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="36" font-size="22" font-weight="700">报告层什么时候调用写入</text><rect x="20" y="56" width="560" height="62" rx="9" fill="#e0edfc"/><text x="36" y="79" font-size="18" font-weight="700">session.codeTask.inspect()</text><text x="36" y="102" font-size="16">取得同一份 review，交给 acceptTask</text><rect x="20" y="128" width="560" height="62" rx="9" fill="#e0f1e9"/><text x="36" y="151" font-size="18" font-weight="700">accepted &amp;&amp; task.memoryCapture</text><text x="36" y="174" font-size="16">两个条件都满足才调用 saveAcceptedMemory</text><rect x="20" y="200" width="560" height="62" rx="9" fill="#fff0d9"/><text x="36" y="223" font-size="18" font-weight="700">长期记忆写入</text><text x="36" y="246" font-size="16">单独报告 saved、unchanged 或写入失败等状态</text></g></svg>
