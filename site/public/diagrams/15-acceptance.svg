<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="应用接受：五项证据共同成立"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">应用接受：五项证据共同成立</text><text x="32" y="72" font-size="15" fill="#52667d">下列是当前金额修复的规则，其他任务可采用不同的业务验收格式。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 212L250 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">RunResult.status answered</text><text x="46" y="162" font-size="16" fill="#182c45">且产生实际变化</text><text x="46" y="184" font-size="16" fill="#182c45">否则拒绝</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">变化仅在允许invoice文件</text><text x="376" y="162" font-size="16" fill="#182c45">额外规则修改也拒绝</text><text x="376" y="184" font-size="16" fill="#182c45">基线差异来自实际采集</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">checkMatchesCurrent true</text><text x="706" y="162" font-size="16" fill="#182c45">stable且标识相同</text><text x="706" y="184" font-size="16" fill="#182c45">旧通过不能证明新内容</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">最近检查status passed</text><text x="46" y="382" font-size="16" fill="#182c45">exitCode必须为0</text><text x="46" y="404" font-size="16" fill="#182c45">失败/未验收都拒绝</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">可信stdout的passed true</text><text x="376" y="382" font-size="16" fill="#182c45">不解析模型成功措辞</text><text x="376" y="404" font-size="16" fill="#182c45">格式或业务失败都拒绝</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">accepted true</text><text x="706" y="382" font-size="16" fill="#182c45">当前范围可审阅交付</text><text x="706" y="404" font-size="16" fill="#182c45">不自动提交/合并/部署</text><text x="32" y="506" font-size="15" fill="#52667d">接受适用于这次观察到的内容；报告后修改需重新取证；不保证全部输入正确。</text></g></svg>