<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title"><title id="title">从待验收到完成回执</title><rect width="640" height="280" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="34" font-size="22" font-weight="700">从待验收到完成回执</text><rect x="20" y="52" width="600" height="42" rx="8" fill="#e0edfc"/><text x="34" y="79" font-size="17">resumePendingCheck 先核对任务与副本指纹</text><rect x="20" y="107" width="600" height="42" rx="8" fill="#fff0d9"/><text x="34" y="134" font-size="17">claimCheck 独占创建 .started，随后调用 run_check</text><rect x="20" y="162" width="600" height="42" rx="8" fill="#e0f1e9"/><text x="34" y="189" font-size="17">验收与取证完成 → saveCheckReceipt 写入 .done</text><rect x="20" y="217" width="600" height="42" rx="8" fill="#e0edfc"/><text x="34" y="244" font-size="17">再次启动 → 用检查点摘要匹配回执，直接返回旧结果</text></g></svg>
