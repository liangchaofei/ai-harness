<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-label="runLoop：哪一步才算调用模型？"><rect width="840" height="420" rx="18" fill="#f4f8fc"/><g fill="#142b48" font-family="system-ui,sans-serif"><text x="36" y="52" font-size="26" font-weight="bold">runLoop：哪一步才算调用模型？</text><rect x="36" y="80" width="768" height="84" rx="12" fill="#e0efff"/><text x="58" y="112" font-size="21" font-weight="bold">准备成功 → input_prepared → model_start</text><text x="58" y="141" font-size="18">这些事件中的序号是计划值；此时实际计数还没增加。</text><rect x="36" y="186" width="768" height="84" rx="12" fill="#dcf4e9"/><text x="58" y="218" font-size="21" font-weight="bold">检查仍未停止 → 更新 modelCalls → 调用 callModel</text><text x="58" y="247" font-size="18">收到完整响应后写回原记录；临时输入不写回。</text><rect x="36" y="292" width="768" height="84" rx="12" fill="#fff0d6"/><text x="58" y="324" font-size="21" font-weight="bold">准备失败，或启动前取消、到期</text><text x="58" y="353" font-size="18">不会进入 callModel，也不会增加本轮模型调用次数。</text></g></svg>
