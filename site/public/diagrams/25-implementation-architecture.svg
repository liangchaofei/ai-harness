<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" role="img" aria-labelledby="title"><title id="title">两个运行段怎样写入同一个会话文件</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#45637c"/></marker></defs><rect width="640" height="416" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="35" font-size="22" font-weight="700">两个运行段怎样写入同一个会话文件</text><rect x="20" y="56" width="600" height="64" rx="9" fill="#e0edfc"/><text x="36" y="81" font-size="20" font-weight="700">CLI → createSessionLog</text><text x="36" y="105" font-size="17">独占创建 session.jsonl，写版本与副本路径</text><path d="M320 120v21" marker-end="url(#arrow)" stroke="#45637c" stroke-width="2"/><rect x="20" y="143" width="600" height="64" rx="9" fill="#e0f1e9"/><text x="36" y="168" font-size="20" font-weight="700">Runtime → CLI → appendRun</text><text x="36" y="192" font-size="17">首段返回 11 条，从下标 0 开始写入</text><path d="M320 207v21" marker-end="url(#arrow)" stroke="#45637c" stroke-width="2"/><rect x="20" y="230" width="600" height="64" rx="9" fill="#fff0d9"/><text x="36" y="255" font-size="20" font-weight="700">Runtime → CLI → appendRun</text><text x="36" y="279" font-size="17">追问段返回 13 条，从下标 11 只追加 2 条</text><path d="M320 294v21" marker-end="url(#arrow)" stroke="#45637c" stroke-width="2"/><rect x="20" y="317" width="600" height="64" rx="9" fill="#e0edfc"/><text x="36" y="342" font-size="20" font-weight="700">另一个进程 → inspect-log.ts</text><text x="36" y="366" font-size="17">读会话头和两段记录，显示 11 + 2 条新增消息</text></g></svg>
