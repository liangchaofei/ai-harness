<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-labelledby="title"><title id="title">第五阶段 · 可靠执行与恢复</title><rect width="620" height="214" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="32" font-size="22" font-weight="700">第五阶段 · 可靠执行与恢复</text><rect x="20" y="48" width="580" height="40" rx="8" fill="#e0edfc"/><text x="34" y="74" font-size="17">旧进程留下检查点、占用标记和完成回执</text><rect x="20" y="100" width="580" height="40" rx="8" fill="#e0f1e9"/><text x="34" y="126" font-size="17">新 CLI：先诊断，再由操作者决定是否提交验收</text><rect x="20" y="152" width="580" height="40" rx="8" fill="#fff0d9"/><text x="34" y="178" font-size="17">结果不明时保留证据，交给操作者核对</text></g></svg>
