<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 207" role="img" aria-labelledby="title">
<title id="title">一次路径修复如何跨进程继续</title>
<defs><marker id="end" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#465470"/></marker></defs>
<rect width="1168" height="207" rx="16" fill="#f3f5fa"/>
<g font-family="system-ui, PingFang SC, sans-serif" fill="#192642">
<text x="28" y="49" font-size="25" font-weight="700">一次路径修复如何跨进程继续</text>
<rect x="28" y="80" width="248" height="71" rx="11" fill="#ffffff" stroke="#aab3c2" stroke-width="2"/><text x="152" y="110" font-size="20" font-weight="700" text-anchor="middle">准备进程</text><text x="152" y="135" font-size="15" text-anchor="middle">route.json → route.pending.json</text><path d="M280 116 H310" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="316" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="440" y="110" font-size="20" font-weight="700" text-anchor="middle">决定进程</text><text x="440" y="135" font-size="15" text-anchor="middle">写入 .approval</text><path d="M568 116 H598" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="604" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="728" y="110" font-size="20" font-weight="700" text-anchor="middle">恢复进程</text><text x="728" y="135" font-size="15" text-anchor="middle">核对摘要和副本，再占用</text><path d="M856 116 H886" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="892" y="80" width="248" height="71" rx="11" fill="#ffffff" stroke="#aab3c2" stroke-width="2"/><text x="1016" y="110" font-size="20" font-weight="700" text-anchor="middle">验收工具</text><text x="1016" y="135" font-size="15" text-anchor="middle">执行并写入 .done</text>
<text x="28" y="182" font-size="16">检查点声明需要批准。恢复进程在看到有效 approve 前不会创建 .started。</text>
</g></svg>
