<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" role="img" aria-label="摘要只进入本轮模型输入"><rect width="900" height="354" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="44" font-size="26" font-weight="700">摘要只进入本轮模型输入</text><rect x="28" y="63" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="94" font-size="21" font-weight="700">完整历史 → prepareMessages</text><text x="48" y="123" font-size="18">先选择近期完整批次，再从省略部分提取验收摘要。</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">原任务 → 摘要 → 近期完整批次</text><text x="48" y="216" font-size="18">摘要不是工具反馈，不插入同一批请求与反馈之间。</text><rect x="28" y="249" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="280" font-size="21" font-weight="700">真实结果 → 完整记录与验收报告</text><text x="48" y="309" font-size="18">摘要不写回历史，也不参与最终接受判断。</text></g></svg>
