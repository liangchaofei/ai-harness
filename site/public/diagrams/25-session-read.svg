<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 204" role="img" aria-labelledby="title"><title id="title">两个进程共用一个文件</title><rect width="600" height="204" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="33" font-size="22" font-weight="700">两个进程共用一个文件</text><rect x="20" y="50" width="560" height="39" rx="8" fill="#e0edfc"/><text x="35" y="76" font-size="17">写入进程：main.ts 跑修复和追问</text><rect x="20" y="98" width="560" height="39" rx="8" fill="#e0f1e9"/><text x="35" y="124" font-size="17">磁盘：版本行 → 首段行 → 追问行</text><rect x="20" y="146" width="560" height="39" rx="8" fill="#fff0d9"/><text x="35" y="172" font-size="17">读取进程：inspect-log.ts 逐行解析</text></g></svg>
