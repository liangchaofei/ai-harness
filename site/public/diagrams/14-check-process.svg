<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="固定验收：从空参数到真实进程观察"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">固定验收：从空参数到真实进程观察</text><text x="32" y="72" font-size="15" fill="#52667d">run_check 只接受 {}；可执行程序、参数和 cwd 已由应用确定。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M810 212L520 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="671.0" y="264.0" font-size="14" fill="#52667d">结束</text><path d="M450 212L220 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="341.0" y="264.0" font-size="14" fill="#52667d">外部取消</text><path d="M165 432V465H810V432" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">准备：复制可信命令配置</text><text x="46" y="162" font-size="16" fill="#182c45">executable + args</text><text x="46" y="184" font-size="16" fill="#182c45">模型不能提交 shell 命令</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">spawn 直接子进程</text><text x="376" y="162" font-size="16" fill="#182c45">shell:false / env:{}</text><text x="376" y="184" font-size="16" fill="#182c45">stdin 忽略，输出进入管道</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">持续收 stdout / stderr</text><text x="706" y="162" font-size="16" fill="#182c45">合计保留 8 KiB</text><text x="706" y="184" font-size="16" fill="#182c45">超额 / 3 秒到期：停止</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">外部运行 signal 触发</text><text x="46" y="382" font-size="16" fill="#182c45">kill 直接子进程</text><text x="46" y="404" font-size="16" fill="#182c45">等待 close 并清理监听</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">进程退出或单次限制停止</text><text x="376" y="382" font-size="16" fill="#182c45">close 后清理并交出结果</text><text x="376" y="404" font-size="16" fill="#182c45">CheckResult + 有界输出</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">signal 已取消：抛回 Runtime</text><text x="706" y="382" font-size="16" fill="#182c45">本项不伪造验收结果</text><text x="706" y="404" font-size="16" fill="#182c45">停止新动作，保留旧事实</text><text x="32" y="506" font-size="15" fill="#52667d">只支持不派生后台进程的受控验收；不承诺进程树管理或硬实时期限。</text></g></svg>