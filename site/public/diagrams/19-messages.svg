<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="第二次调用：三条事实、四条输入，提示不积累"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#486784"/></marker></defs><rect width="960" height="540" rx="16" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#182c45"><text x="30" y="42" font-size="24" font-weight="700">第二次调用：三条事实、四条输入，提示不积累</text><text x="30" y="74" font-size="15" fill="#52667d">固定观察中的实际读取；条数相等也不表示内容相同。</text><rect x="30" y="125" width="270" height="210" rx="10" fill="#e4f4eb" stroke="#b6c8d9"/><text x="45" y="155" font-size="16">准备前完整记录：3条</text><text x="45" y="179" font-size="16">user：读取当前实现</text><text x="45" y="203" font-size="16">assistant：read_current</text><text x="45" y="227" font-size="16">toolResult：实际源码</text><rect x="345" y="125" width="270" height="245" rx="10" fill="#e1efff" stroke="#b6c8d9"/><text x="360" y="155" font-size="16">本轮模型输入：4条</text><text x="360" y="179" font-size="16">user：读取当前实现</text><text x="360" y="203" font-size="16">assistant：read_current</text><text x="360" y="227" font-size="16">toolResult：实际源码</text><text x="360" y="251" font-size="16">user：本轮临时提示</text><rect x="660" y="125" width="270" height="245" rx="10" fill="#e4f4eb" stroke="#b6c8d9"/><text x="675" y="155" font-size="16">正常结束完整记录：4条</text><text x="675" y="179" font-size="16">user：读取当前实现</text><text x="675" y="203" font-size="16">assistant：read_current</text><text x="675" y="227" font-size="16">toolResult：实际源码</text><text x="675" y="251" font-size="16">assistant：实际返回的回答</text><path d="M300 230H340" fill="none" stroke="#486784" stroke-width="2" marker-end="url(#arrow)"/><path d="M615 230H655" fill="none" stroke="#486784" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="420" font-size="17">准备失败时：保留左侧3条，不新增本轮输入事件，也不发起第二次模型调用。</text><text x="30" y="460" font-size="17">模型读取右侧前的输入副本；循环把实际回答写入原记录，不写入临时提示。</text><text x="30" y="510" font-size="15" fill="#52667d">note模式：input hasInputNote=true；result.messages hasInputNote=false。</text></g></svg>