<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" role="img"><title>同一批请求，按工具分别执行或拒绝</title><rect width="620" height="280" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="32" font-size="22" font-weight="700">同一批请求，按工具分别执行或拒绝</text><rect x="20" y="49" width="580" height="40" rx="8" fill="#e0edfc"/><text x="34" y="75" font-size="17">--read-only → parseArgs → runCli → runSession</text><path d="M310 90v10l-4-4m4 4l4-4" fill="none" stroke="#48637b"/><rect x="20" y="103" width="580" height="40" rx="8" fill="#fff0d9"/><text x="34" y="129" font-size="17">restrictToReadOnly：保留读取；替换其他工具的 execute</text><path d="M310 144v10l-4-4m4 4l4-4" fill="none" stroke="#48637b"/><rect x="20" y="157" width="580" height="40" rx="8" fill="#e0f1e9"/><text x="34" y="183" font-size="17">Runtime 调用 read_file → 返回真实内容</text><path d="M310 198v10l-4-4m4 4l4-4" fill="none" stroke="#48637b"/><rect x="20" y="211" width="580" height="40" rx="8" fill="#e0edfc"/><text x="34" y="237" font-size="17">Runtime 调用 replace_text 或 run_check → 返回拒绝反馈</text></g></svg>
