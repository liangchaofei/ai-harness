<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" role="img"><title>两个命令观察同一个副本</title><rect width="640" height="256" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="18" y="30" font-size="21" font-weight="700">两个命令观察同一个副本</text><rect x="18" y="48" width="604" height="52" rx="8" fill="#e0edfc"/><text x="32" y="69" font-size="18" font-weight="700">save</text><text x="32" y="90" font-size="15">固定模型只提交 replace_text</text><path d="M320 102v8l-4-4m4 4l4-4" fill="none" stroke="#476783"/><rect x="18" y="112" width="604" height="52" rx="8" fill="#e0f1e9"/><text x="32" y="133" font-size="18" font-weight="700">pending.json</text><text x="32" y="154" font-size="15">保存副本路径和内容标识</text><path d="M320 166v8l-4-4m4 4l4-4" fill="none" stroke="#476783"/><rect x="18" y="176" width="604" height="52" rx="8" fill="#fff0d9"/><text x="32" y="197" font-size="18" font-weight="700">resume</text><text x="32" y="218" font-size="15">跳过模型连接，实际执行验收</text></g></svg>
