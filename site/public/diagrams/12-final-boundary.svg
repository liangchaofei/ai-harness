<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="已有材料齐全，最终预览仍可能不能交付"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">已有材料齐全，最终预览仍可能不能交付</text><text x="32" y="72" font-size="15" fill="#52667d">以两个文件已成功读取、最后一条 SSE 缺终止标记为例。</text><path d="M290 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M610 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M700 212L260 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M290 370L360 370" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="260" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">完整模型请求</text><text x="46" y="162" font-size="16" fill="#182c45">read_invoice / read_pricing</text><text x="46" y="184" font-size="16" fill="#182c45">两项结果写入历史</text><rect x="360" y="110" width="250" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">下一次模型：文字预览</text><text x="376" y="162" font-size="16" fill="#182c45">onEvent 可见固定答案</text><text x="376" y="184" font-size="16" fill="#182c45">服务终止标记尚未到达</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">cutoff：响应体结束</text><text x="706" y="162" font-size="16" fill="#182c45">没有 done.message</text><text x="706" y="184" font-size="16" fill="#182c45">model_protocol</text><rect x="30" y="330" width="260" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">停止记录仍保留</text><text x="46" y="382" font-size="16" fill="#182c45">先前 assistant + 工具结果</text><text x="46" y="404" font-size="16" fill="#182c45">没有最后一条回答</text><rect x="360" y="330" width="250" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">任务接受：false</text><text x="376" y="382" font-size="16" fill="#182c45">因为 status 是 failed</text><text x="376" y="404" font-size="16" fill="#182c45">预览不是保存的答案</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">normal 完整结束时</text><text x="706" y="382" font-size="16" fill="#182c45">answered + 读取证据</text><text x="706" y="404" font-size="16" fill="#182c45">语义仍需独立核对</text><text x="32" y="506" font-size="15" fill="#52667d">控制程序走对路径，与模型自主完成任务是两类证据；固定回答只能证明前者。</text></g></svg>