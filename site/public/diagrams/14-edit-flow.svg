<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="一次精确替换怎样落到副本文件"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">一次精确替换怎样落到副本文件</text><text x="32" y="72" font-size="15" fill="#52667d">模型提供 path / oldText / newText；工具逐步检查并完成实际写入。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 212L250 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">检查可写清单</text><text x="46" y="162" font-size="16" fill="#182c45">从同一工作区读取当前原文</text><text x="46" y="184" font-size="16" fill="#182c45">oldText 必须唯一命中</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">拼出 next，检查源字节数</text><text x="376" y="162" font-size="16" fill="#182c45">最多 16 KiB</text><text x="376" y="184" font-size="16" fill="#182c45">创建同目录 .agent-*.tmp</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">写入并关闭临时文件</text><text x="706" y="162" font-size="16" fill="#182c45">尚未替换目标文件</text><text x="706" y="184" font-size="16" fill="#182c45">失败或取消清理临时文件</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">提交前复查路径与原文</text><text x="46" y="382" font-size="16" fill="#182c45">当前内容应仍等于 source</text><text x="46" y="404" font-size="16" fill="#182c45">检查运行信号</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">rename 替换目标</text><text x="376" y="382" font-size="16" fill="#182c45">返回 path / replaced: 1</text><text x="376" y="404" font-size="16" fill="#182c45">后续读取能看见新内容</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">副作用已经发生</text><text x="706" y="382" font-size="16" fill="#182c45">之后取消不自动撤销</text><text x="706" y="404" font-size="16" fill="#182c45">原材料仍是另一份文件</text><text x="32" y="506" font-size="15" fill="#52667d">这是单文件的常规冲突检查，不是跨进程写锁、多文件事务或自动回滚。</text></g></svg>