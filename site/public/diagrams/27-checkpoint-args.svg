<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" role="img"><title>参数读入后还要返回</title><rect width="640" height="256" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="18" y="30" font-size="21" font-weight="700">参数读入后还要返回</text><rect x="18" y="48" width="604" height="52" rx="8" fill="#e0edfc"/><text x="32" y="69" font-size="18" font-weight="700">parseArgs</text><text x="32" y="90" font-size="15">读取 --checkpoint 或 --resume-check 的路径</text><path d="M320 102v8l-4-4m4 4l4-4" fill="none" stroke="#476783"/><rect x="18" y="112" width="604" height="52" rx="8" fill="#e0f1e9"/><text x="32" y="133" font-size="18" font-weight="700">CliOptions</text><text x="32" y="154" font-size="15">把路径放进返回对象</text><path d="M320 166v8l-4-4m4 4l4-4" fill="none" stroke="#476783"/><rect x="18" y="176" width="604" height="52" rx="8" fill="#fff0d9"/><text x="32" y="197" font-size="18" font-weight="700">runCli</text><text x="32" y="218" font-size="15">读取相应字段，选择保存或恢复</text></g></svg>
