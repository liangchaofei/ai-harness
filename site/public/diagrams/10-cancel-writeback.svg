<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-label="取消时，哪些东西已经保存？"><rect width="900" height="356" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="42" font-size="25" font-weight="700">取消时，哪些东西已经保存？</text><rect x="28" y="62" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="93" font-size="21" font-weight="700">模型等待中取消</text><text x="48" y="122" font-size="18">保留以前的完整记录；当前迟到响应不写入。</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">model_end 通知中取消</text><text x="48" y="216" font-size="18">当前模型消息已保存；其中的请求不再执行。</text><rect x="28" y="250" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="281" font-size="21" font-weight="700">工具等待中取消</text><text x="48" y="310" font-size="18">循环追加 completedResults；不保存取消项，不再开始剩余项。</text></g></svg>
