<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" role="img" aria-label="输入预算只作用于本轮消息"><rect width="900" height="354" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="44" font-size="26" font-weight="700">输入预算只作用于本轮消息</text><rect x="28" y="63" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="94" font-size="21" font-weight="700">完整历史 → history 副本</text><text x="48" y="123" font-size="18">prepareMessages 只读副本，原始请求与反馈仍由 Runtime 保存。</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">selectInput → selected → callModel</text><text x="48" y="216" font-size="18">日志比较消息数组字节数；未超过内部目标时发送全量。</text><rect x="28" y="249" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="280" font-size="21" font-weight="700">实际工具反馈 → 完整历史 → 交付报告</text><text x="48" y="309" font-size="18">省略的只是发送给模型的输入；验收依据和记录不随裁剪消失。</text></g></svg>
