<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title"><title id="title">从验收结果挑出根路径用例</title><rect width="600" height="280" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="36" font-size="22" font-weight="700">从验收结果挑出根路径用例</text><rect x="20" y="56" width="560" height="62" rx="9" fill="#e0edfc"/><text x="36" y="79" font-size="18" font-weight="700">check.stdout</text><text x="36" y="102" font-size="16">解析 JSON，取得 report.cases</text><rect x="20" y="128" width="560" height="62" rx="9" fill="#e0f1e9"/><text x="36" y="151" font-size="18" font-weight="700">report.cases.find</text><text x="36" y="174" font-size="16">找到 input 为 / 且 passed 为 true 的用例</text><rect x="20" y="200" width="560" height="62" rx="9" fill="#fff0d9"/><text x="36" y="223" font-size="18" font-weight="700">sample.expected</text><text x="36" y="246" font-size="16">确认 actual 相同后，用预期值生成 hint</text></g></svg>
