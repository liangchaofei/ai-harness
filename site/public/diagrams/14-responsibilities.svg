<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="原材料、工作副本与可信验收各有归属"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">原材料、工作副本与可信验收各有归属</text><text x="32" y="72" font-size="15" fill="#52667d">副本由应用创建；读写和进程执行在 coding-tools；循环仍使用原 Runtime。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M800 212L570 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">fixtures：原项目与 README</text><text x="46" y="162" font-size="16" fill="#182c45">应用 cp 到临时目录</text><text x="46" y="184" font-size="16" fill="#182c45">原材料不作为写工具目标</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">临时工作副本</text><text x="376" y="162" font-size="16" fill="#182c45">允许读 .ts / .json / .md</text><text x="376" y="184" font-size="16" fill="#182c45">只准写当前 invoice 文件</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">工作区工具共用环境</text><text x="706" y="162" font-size="16" fill="#182c45">查找 / 搜索 / 读取</text><text x="706" y="184" font-size="16" fill="#182c45">replace_text / run_check</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">应用外置验收脚本</text><text x="46" y="382" font-size="16" fill="#182c45">模型写工具不能修改</text><text x="46" y="404" font-size="16" fill="#182c45">命令、参数由应用固定</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">Node 验收进程</text><text x="376" y="382" font-size="16" fill="#182c45">cwd 指向工作副本</text><text x="376" y="404" font-size="16" fill="#182c45">独立加载修改后的代码</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">Runtime → 应用报告</text><text x="706" y="382" font-size="16" fill="#182c45">保存实际结果后继续</text><text x="706" y="404" font-size="16" fill="#182c45">停止后展示副本差异</text><text x="32" y="506" font-size="15" fill="#52667d">固定命令与空环境不构成 OS 隔离；生成代码仍有 Node 权限，仅用于受控练习。</text></g></svg>