<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 225" role="img" aria-labelledby="title"><title id="title">同一个检查点的三个可观察状态</title><rect width="640" height="225" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="34" font-size="22" font-weight="700">同一个检查点的三个可观察状态</text><rect x="20" y="52" width="600" height="42" rx="8" fill="#e0edfc"/><text x="34" y="79" font-size="17">无 .started → 本进程可以尝试独占占用</text><rect x="20" y="107" width="600" height="42" rx="8" fill="#fff0d9"/><text x="34" y="134" font-size="17">有 .started、无有效 .done → 结果不明，停止</text><rect x="20" y="162" width="600" height="42" rx="8" fill="#e0f1e9"/><text x="34" y="189" font-size="17">有 .started 和匹配 .done → 返回已记录的结果</text></g></svg>
