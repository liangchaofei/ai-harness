<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" role="img"><title>第 31 篇在 Coding Agent 的位置</title><rect width="620" height="280" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="32" font-size="22" font-weight="700">第 31 篇在 Coding Agent 的位置</text><rect x="20" y="49" width="580" height="40" rx="8" fill="#e0edfc"/><text x="34" y="75" font-size="17">操作者启动任务 → CLI 选定本次权限</text><path d="M310 90v10l-4-4m4 4l4-4" fill="none" stroke="#48637b"/><rect x="20" y="103" width="580" height="40" rx="8" fill="#fff0d9"/><text x="34" y="129" font-size="17">模型提出动作 → Runtime 校验参数</text><path d="M310 144v10l-4-4m4 4l4-4" fill="none" stroke="#48637b"/><rect x="20" y="157" width="580" height="40" rx="8" fill="#e0f1e9"/><text x="34" y="183" font-size="17">本篇接入：工具真正执行前落实权限</text><path d="M310 198v10l-4-4m4 4l4-4" fill="none" stroke="#48637b"/><rect x="20" y="211" width="580" height="40" rx="8" fill="#e0edfc"/><text x="34" y="237" font-size="17">允许或拒绝的反馈 → Runtime 保存 → 模型</text></g></svg>
