<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 283" role="img"><title>一次批准如何控制一次调用</title><rect width="670" height="283" rx="14" fill="#f4f8fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="18" y="32" font-size="21" font-weight="700">一次批准如何控制一次调用</text><rect x="18" y="47" width="634" height="41" rx="8" fill="#dcebf9"/><text x="33" y="74" font-size="17">runSession 用 --approve-tools 包装本地工具</text><path d="M335 90v10m-4-4 4 4 4-4" fill="none" stroke="#48637b" stroke-width="2"/><rect x="18" y="102" width="634" height="41" rx="8" fill="#fcebcf"/><text x="33" y="129" font-size="17">Runtime → 包装后的 execute：路径、原文、新文本</text><path d="M335 145v10m-4-4 4 4 4-4" fill="none" stroke="#48637b" stroke-width="2"/><rect x="18" y="157" width="634" height="41" rx="8" fill="#dff0e7"/><text x="33" y="184" font-size="17">终端 → yes：转交原工具；其他：拒绝反馈</text><path d="M335 200v10m-4-4 4 4 4-4" fill="none" stroke="#48637b" stroke-width="2"/><rect x="18" y="212" width="634" height="41" rx="8" fill="#dcebf9"/><text x="33" y="239" font-size="17">Runtime 保存原请求 ID → 下一项重新询问</text></g></svg>
