<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="title desc"><title id="title">预览不等于完整消息</title><desc id="desc">服务字节还原为帧，由适配器拼接；文字片段经Runtime事件显示；完整消息才保存并执行工具。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1100" height="800" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="35" y="48" font-size="28" font-weight="700">模型还在生成：文字先看，动作等待完整消息</text><text x="35" y="86" font-size="19" fill="#475569">同一个 ModelCall 内持续接收；文字事件不会另起一次模型调用。</text>
<rect x="40" y="125" width="430" height="115" rx="14" fill="#eef2ff" stroke="#818cf8"/><text x="60" y="164" font-size="23" font-weight="700">服务 → 模型包</text><text x="60" y="199" font-size="19">字节 → SSE 帧 → 每家服务自己的片段</text>
<path d="M255 240V290" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="300" width="430" height="145" rx="14" fill="#eef2ff" stroke="#818cf8"/><text x="60" y="339" font-size="23" font-weight="700">适配器持有局部草稿</text><text x="60" y="376" font-size="19">content 追加文字；工具按索引拼接参数</text><text x="60" y="412" font-size="19">此时不调用 execute，不保存 assistant 历史</text>
<path d="M470 370H650" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="492" y="348" font-size="18" fill="#0284c7">text_delta</text>
<rect x="660" y="300" width="395" height="145" rx="14" fill="#f0f9ff" stroke="#38bdf8"/><text x="680" y="339" font-size="23" font-weight="700">应用连接 → Runtime 事件</text><text x="680" y="376" font-size="19">model_text_delta → 终端预览</text><text x="680" y="412" font-size="19">失败时已显示的片段不升级为答案</text>
<path d="M255 445V515" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="280" y="484" font-size="19">终止标记 + 检查通过 → done</text>
<rect x="40" y="525" width="430" height="125" rx="14" fill="#ecfdf5" stroke="#34d399"/><text x="60" y="564" font-size="23" font-weight="700">完整 AssistantMessage</text><text x="60" y="602" font-size="19">应用连接 return → Runtime 保存一次</text>
<path d="M470 587H650" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="660" y="525" width="395" height="125" rx="14" fill="#ecfdf5" stroke="#34d399"/><text x="680" y="564" font-size="23" font-weight="700">原有循环继续</text><text x="680" y="602" font-size="19">工具门禁 / 执行 / 反馈 / 下一次模型</text>
<text x="40" y="715" font-size="20" fill="#475569">缺少终止或读取失败 → 不产出 done → Runtime 模型失败分支停止。</text><text x="40" y="754" font-size="19" fill="#475569">非流式 complete 保留；取消、整次时限与恢复后续建设。</text></g></svg>