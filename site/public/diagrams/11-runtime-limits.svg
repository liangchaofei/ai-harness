<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="三种运行限制：时间、模型次数、工具处理次数"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">三种运行限制：时间、模型次数、工具处理次数</text><text x="32" y="72" font-size="15" fill="#52667d">应用选择上限；Runtime 管计数与期限；模型和工具复用第 10 篇信号。</text><path d="M300 155L360 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M420 212L270 310" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="351.0" y="254.0" font-size="14" fill="#52667d">创建</text><path d="M300 350L360 350" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M620 155L745 210" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">应用 RunAgentOptions</text><text x="46" y="162" font-size="16" fill="#182c45">timeoutMs / maxModelCalls</text><text x="46" y="184" font-size="16" fill="#182c45">maxToolCalls / signal</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">Runtime：runAgent / runLoop</text><text x="376" y="162" font-size="16" fill="#182c45">messages + modelCalls</text><text x="376" y="184" font-size="16" fill="#182c45">toolCalls + 停止结果</text><rect x="30" y="310" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="46" y="340" font-size="16" fill="#182c45">control/run-control</text><text x="46" y="362" font-size="16" fill="#182c45">外部取消 + 整次计时</text><text x="46" y="384" font-size="16" fill="#182c45">产生同一运行 signal</text><rect x="360" y="310" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="340" font-size="16" fill="#182c45">模型 / 工具等待</text><text x="376" y="362" font-size="16" fill="#182c45">信号协作退出</text><text x="376" y="384" font-size="16" fill="#182c45">返回后门禁拒绝迟到结果</text><rect x="690" y="210" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="240" font-size="16" fill="#182c45">结果返回应用</text><text x="706" y="262" font-size="16" fill="#182c45">timedOut / toolLimit</text><text x="706" y="284" font-size="16" fill="#182c45">callLimit / cancelled 等</text><text x="32" y="506" font-size="15" fill="#52667d">模型包的 maxTokens 与单次 HTTP 30 秒保留；它们不限制整次任务的累计工作。</text></g></svg>