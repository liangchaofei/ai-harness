<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="910" viewBox="0 0 1080 910" role="img" aria-labelledby="title desc">
<title id="title">一批三项：保留事实，停止剩余动作</title><desc id="desc">固定程序路径示意；第二项异常不代表它一定没有产生副作用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1080" height="910" fill="#f8fafc"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="28" font-weight="700">一批三项：保留事实，停止剩余动作</text>
<text x="40" y="86" font-size="19" fill="#475569">固定程序路径示意；第二项异常不代表它一定没有产生副作用。</text>
<rect x="40" y="118" width="1000" height="96" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="152" font-size="23" font-weight="700">模型决定：一条 assistant 同时请求 first / second / third</text>
<text x="62" y="185" font-size="20">Runtime 先保存整条 assistant；工具按顺序执行，不是并发。</text>
<path d="M 540 217 L 540 234" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="238" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="272" font-size="23" font-weight="700">first 成功：执行器暂存第一项结果</text>
<text x="62" y="305" font-size="20">results = [first 的 ToolResultMessage]；还未继续请求模型。</text>
<text x="62" y="335" font-size="20">返回内容是实际执行结果，不是提前生成的成功说明。</text>
<path d="M 540 367 L 540 384" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="388" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="422" font-size="23" font-weight="700">second 未知异常：立即退出批次</text>
<text x="62" y="455" font-size="20">ToolBatchError 携带 failure、completedResults = [first] 和原 cause。</text>
<text x="62" y="485" font-size="20">不把未知异常正文伪装成可继续反馈的 toolResult。</text>
<path d="M 540 517 L 540 534" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="538" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="572" font-size="23" font-weight="700">剩余动作停止：third 不调用</text>
<text x="62" y="605" font-size="20">second 可能已有外部效果；没有自动撤销 first 或 second。</text>
<text x="62" y="635" font-size="20">不能把整批写成“从未执行”，也不能直接把失败记录重新发给服务。</text>
<path d="M 540 667 L 540 684" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="688" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="722" font-size="23" font-weight="700">runAgent 接住：先保存 first，再返回 failed</text>
<text x="62" y="755" font-size="20">messages.push(...error.completedResults)；failure.code = tool_execution。</text>
<text x="62" y="785" font-size="20">应用收到失败记录；本次不再调用模型。后续恢复需要另外的协议。</text>
<text x="40" y="858" font-size="18" fill="#475569">保留下来的结果说明已完成什么；它不是重试清单，也不是可精确恢复的检查点。</text></g></svg>