<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title"><title id="title">预览脚本的三次保存</title><rect width="600" height="280" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="36" font-size="22" font-weight="700">预览脚本的三次保存</text><rect x="20" y="56" width="560" height="62" rx="9" fill="#e0edfc"/><text x="36" y="79" font-size="18" font-weight="700">sample-v1，预期 /</text><text x="36" y="102" font-size="16">空数组 → saved</text><rect x="20" y="128" width="560" height="62" rx="9" fill="#e0f1e9"/><text x="36" y="151" font-size="18" font-weight="700">再次传入 sample-v1</text><text x="36" y="174" font-size="16">相同内容和来源 → unchanged</text><rect x="20" y="200" width="560" height="62" rx="9" fill="#fff0d9"/><text x="36" y="223" font-size="18" font-weight="700">sample-v2，预期 /home</text><text x="36" y="246" font-size="16">更新同一主题 → saved，随后读回 /home</text></g></svg>
