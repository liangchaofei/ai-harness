<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="715" viewBox="0 0 1080 715" role="img"><title>工具说明、模型请求与执行的边界</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#64748b"/></marker></defs><rect width="1080" height="715" fill="#f8fafc"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="42" font-size="26" fill="#172554" font-weight="700">工具说明、模型请求与执行的边界</text><text x="30" y="76" font-size="17" fill="#334155">当前实线部分只传递请求；虚线部分尚未实现。</text><rect x="30" y="110" width="465" height="175" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="142" font-size="21" fill="#334155" font-weight="700">① 应用：上下文 + 工具说明</text><text x="50" y="176" font-size="17" fill="#334155">user：请审查 src/cart.ts</text><text x="50" y="204" font-size="17" fill="#334155">tools：read_file，参数 path:string</text><text x="50" y="232" font-size="17" fill="#334155">没有源码，也没有执行函数</text><rect x="585" y="110" width="465" height="175" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="605" y="142" font-size="21" fill="#334155" font-weight="700">② 模型包 → 模型服务</text><text x="605" y="176" font-size="17" fill="#334155">complete 将工具说明包装成 tools</text><text x="605" y="204" font-size="17" fill="#334155">模型根据输入返回文字或 tool_calls</text><text x="605" y="232" font-size="17" fill="#334155">说明进入模型输入，不赋予磁盘权限</text><path d="M495 198 L580 198" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M817 285 L817 335" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="585" y="340" width="465" height="175" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="605" y="372" font-size="21" fill="#334155" font-weight="700">③ 服务响应 → 项目消息</text><text x="605" y="406" font-size="17" fill="#334155">decodeMessage 保留全部请求</text><text x="605" y="434" font-size="17" fill="#334155">call_01 / read_file / 原始参数文本</text><text x="605" y="462" font-size="17" fill="#334155">finish_reason:tool_calls → toolUse</text><path d="M585 428 L500 428" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="340" width="465" height="175" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="372" font-size="21" fill="#334155" font-weight="700">④ 应用只展示待执行动作</text><text x="50" y="406" font-size="17" fill="#334155">message 接住 AssistantMessage</text><text x="50" y="434" font-size="17" fill="#334155">逐项打印 toolCalls；执行次数为 0</text><text x="50" y="462" font-size="17" fill="#334155">没有文件结果，也没有第二次模型调用</text><path d="M260 515 L260 565" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="570" width="1020" height="110" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="50" y="602" font-size="21" fill="#334155" font-weight="700">后续执行层：下一篇建设</text><text x="50" y="636" font-size="17" fill="#334155">检查名称、参数与工作范围 → 本地执行 → 结果关联请求 ID → 反馈给模型</text></g></svg>