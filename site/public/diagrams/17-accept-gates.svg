<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-label="acceptTask：先检查任务条件，再检查业务结果"><rect width="900" height="356" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="42" font-size="25" font-weight="700">acceptTask：先检查任务条件，再检查业务结果</text><rect x="28" y="62" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="93" font-size="21" font-weight="700">运行与变化</text><text x="48" y="122" font-size="18">answered，并且有变化、所有变化路径都在 writablePaths 内。</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">当前内容与验收</text><text x="48" y="216" font-size="18">最近验收匹配当前内容，并且验收进程通过。</text><rect x="28" y="250" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="281" font-size="21" font-weight="700">解析 stdout</text><text x="48" y="310" font-size="18">只有可信脚本明确返回 passed: true 才接受；任一条件不满足就拒绝。</text></g></svg>
