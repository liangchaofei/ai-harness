<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="一次验收：何时写入可用记录"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">一次验收：何时写入可用记录</text><text x="32" y="72" font-size="15" fill="#52667d">run_check只接受{}；会话调用原runCheck；仅完整执行后保存证据。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 212L250 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">先lastCheck = undefined</text><text x="46" y="162" font-size="16" fill="#182c45">使上次记录不可再用</text><text x="46" y="184" font-size="16" fill="#182c45">采集before：revision A</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">await runCheck(...)</text><text x="376" y="162" font-size="16" fill="#182c45">真实固定命令与实际输出</text><text x="376" y="184" font-size="16" fill="#182c45">取消/启动异常：抛回Runtime</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">采集after：revision A/B</text><text x="706" y="162" font-size="16" fill="#182c45">A等于after才stable</text><text x="706" y="184" font-size="16" fill="#182c45">进程通过不代表内容稳定</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">完整取得实际观察</text><text x="46" y="382" font-size="16" fill="#182c45">lastCheck = evidence</text><text x="46" y="404" font-size="16" fill="#182c45">结果可为passed或failed</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">副本返回给工具</text><text x="376" y="382" font-size="16" fill="#182c45">JSON → toolResult → 历史</text><text x="376" y="404" font-size="16" fill="#182c45">下一轮模型读实际反馈</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">inspect另行重新采集</text><text x="706" y="382" font-size="16" fill="#182c45">stable且标识与当前相同</text><text x="706" y="404" font-size="16" fill="#182c45">才checkMatchesCurrent</text><text x="32" y="506" font-size="15" fill="#52667d">异常中断不保存新记录；stable只比较前后两点，不排除期间短暂修改再恢复。</text></g></svg>