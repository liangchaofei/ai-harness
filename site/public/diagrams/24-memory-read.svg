<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title"><title id="title">读取时怎样处理停用笔记</title><rect width="600" height="280" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="36" font-size="22" font-weight="700">读取时怎样处理停用笔记</text><rect x="20" y="56" width="560" height="62" rx="9" fill="#e0edfc"/><text x="36" y="79" font-size="18" font-weight="700">readMemoryNotes</text><text x="36" y="102" font-size="16">从 notes.json 读取并校验记录数组</text><rect x="20" y="128" width="560" height="62" rx="9" fill="#e0f1e9"/><text x="36" y="151" font-size="18" font-weight="700">loadTaskMemory</text><text x="36" y="174" font-size="16">主题匹配，而且 enabled 不是 false</text><rect x="20" y="200" width="560" height="62" rx="9" fill="#fff0d9"/><text x="36" y="223" font-size="18" font-weight="700">返回值</text><text x="36" y="246" font-size="16">命中时返回 TaskMemory，停用时返回 undefined</text></g></svg>
