<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="一批工具：检查取消，再开始下一项"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="480" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">一批工具：检查取消，再开始下一项</text><text x="32" y="72" font-size="15" fill="#52667d">示意：read_1 已完成，wait_2 等待时取消，read_3 不执行。</text><path d="M300 150L360 150" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M495 190L495 260" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M360 330L300 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="336.0" y="323.0" font-size="14" fill="#52667d">是</text><path d="M630 330L690 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="666.0" y="323.0" font-size="14" fill="#52667d">否</text><rect x="30" y="110" width="270" height="80" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">已有 results：read_1</text><text x="46" y="162" font-size="16" fill="#182c45">保留真实读取反馈</text><rect x="360" y="110" width="270" height="80" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">进入 wait_2 前检查</text><text x="376" y="162" font-size="16" fill="#182c45">通知后再次检查</text><rect x="360" y="260" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="290" font-size="16" fill="#182c45">await tool.execute(..., signal)</text><text x="376" y="312" font-size="16" fill="#182c45">协作退出 / 迟到返回</text><text x="376" y="334" font-size="16" fill="#182c45">返回后检查：已经取消？</text><rect x="30" y="300" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="46" y="330" font-size="16" fill="#182c45">已取消：不保存 wait_2</text><text x="46" y="352" font-size="16" fill="#182c45">ToolBatchCancelled(results)</text><text x="46" y="374" font-size="16" fill="#182c45">循环接住并保存 read_1</text><rect x="690" y="290" width="240" height="80" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="320" font-size="16" fill="#182c45">未取消：保存本项结果</text><text x="706" y="342" font-size="16" fill="#182c45">tool_end → 下一项门禁</text><text x="32" y="456" font-size="15" fill="#52667d">取消不伪造失败反馈，不补未执行项，不回滚已经发生的副作用。</text></g></svg>