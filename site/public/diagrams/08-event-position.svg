<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc">
<title id="title">运行过程通知与最终结果分开传递</title><desc id="desc">应用传入配置和观察函数，Runtime调用模型和工具并保存历史，摘要事件经派发器送给应用，最终结果仍由runAgent返回。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1100" height="730" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="35" y="48" font-size="28" font-weight="700">运行过程可见，历史仍由 Runtime 保存</text>
<text x="35" y="85" font-size="19" fill="#475569">实线表示调用与结果；虚线表示事件摘要，不进入模型消息。</text>
<rect x="330" y="120" width="410" height="110" rx="14" fill="#ecfdf5" stroke="#34d399"/>
<text x="355" y="158" font-size="23" font-weight="700">应用调用 runAgent</text><text x="355" y="192" font-size="19">传任务、工具、callModel、onEvent</text>
<path d="M535 230V290" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="330" y="300" width="410" height="155" rx="14" fill="#eef2ff" stroke="#818cf8"/>
<text x="355" y="337" font-size="23" font-weight="700">Runtime 推进任务</text><text x="355" y="373" font-size="19">调用模型 → 检查并执行工具</text><text x="355" y="406" font-size="19">messages 记录 → 下一次模型输入</text><text x="355" y="435" font-size="18" fill="#475569">事件不替代 messages.push(...results)</text>
<rect x="35" y="305" width="240" height="145" rx="14" fill="#fff7ed" stroke="#fb923c"/>
<text x="55" y="344" font-size="22" font-weight="700">模型 / 具体工具</text><text x="55" y="380" font-size="19">接收调用，返回结果</text><text x="55" y="414" font-size="19">不负责更新界面</text>
<path d="M330 370H275" stroke="#64748b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="800" y="300" width="265" height="155" rx="14" fill="#f0f9ff" stroke="#38bdf8"/>
<text x="820" y="337" font-size="22" font-weight="700">应用 onEvent</text><text x="820" y="373" font-size="19">派发器传入 RunEvent</text><text x="820" y="406" font-size="19">实时打印或更新界面</text><text x="820" y="435" font-size="18" fill="#475569">不取得历史写入权</text>
<path d="M740 370H800" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<path d="M535 455V530" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="330" y="540" width="410" height="110" rx="14" fill="#ecfdf5" stroke="#34d399"/>
<text x="355" y="578" font-size="23" font-weight="700">应用接住 RunResult</text><text x="355" y="615" font-size="19">停止原因、历史、runId、观察失败数</text>
<text x="35" y="700" font-size="19" fill="#475569">本篇只通知完整动作；流式文本、持久化与完整 Tracing 留给后续。</text></g></svg>