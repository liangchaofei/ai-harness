<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title desc">
<title id="title">固定观察入口：一读一答，八条通知</title><desc id="desc">这是真实 Runtime 配固定模型响应的程序轨迹；文件读取仍为实际 I/O。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1080" height="790" fill="#f8fafc"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="28" font-weight="700">固定观察入口：一读一答，八条通知</text>
<text x="40" y="86" font-size="19" fill="#475569">这是真实 Runtime 配固定模型响应的程序轨迹；文件读取仍为实际 I/O。</text>
<rect x="40" y="118" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="152" font-size="23" font-weight="700">sequence 1–3：启动并取得完整模型消息</text>
<text x="62" y="185" font-size="20">1 run_start → 2 model_start（modelCall: 1）。</text>
<text x="62" y="215" font-size="20">固定等待 500 ms → 保存 assistant → 3 model_end（toolCallCount: 1）。</text>
<path d="M 540 247 L 540 264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="268" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="302" font-size="23" font-weight="700">sequence 4–5：处理 read_1</text>
<text x="62" y="335" font-size="20">4 tool_start → 名称 / JSON / schema → read_file.execute。</text>
<text x="62" y="365" font-size="20">结果进入本批 results → 5 tool_end（read_1 / isError: false）。</text>
<path d="M 540 397 L 540 414" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="418" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="452" font-size="23" font-weight="700">sequence 6–7：反馈进入下一次模型输入</text>
<text x="62" y="485" font-size="20">整批返回 → messages.push(...results)，历史由 2 条变成 3 条。</text>
<text x="62" y="515" font-size="20">6 model_start（modelCall: 2）→ 固定等待 → 保存回答 → 7 model_end。</text>
<path d="M 540 547 L 540 564" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="568" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="602" font-size="23" font-weight="700">sequence 8：停止并返回应用</text>
<text x="62" y="635" font-size="20">8 run_end（answered / modelCalls: 2）。</text>
<text x="62" y="665" font-size="20">runAgent 返回 RunResult，应用随后展示历史与核对证据。</text>
<text x="40" y="738" font-size="18" fill="#475569">同一次 runId；顺序号只描述通知顺序。已知失败 tool_end/isError:true；未知异常 tool_failed。</text></g></svg>