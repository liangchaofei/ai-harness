<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="同一个 read，支撑内容搜索和全文取证"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">同一个 read，支撑内容搜索和全文取证</text><text x="32" y="72" font-size="15" fill="#52667d">路径查找只看索引；以下两条分支才真正读取文件。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">search_source 接收 query</text><text x="46" y="162" font-size="16" fill="#182c45">逐文件 workspace.read</text><text x="46" y="184" font-size="16" fill="#182c45">按原文本拆行和 includes</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">搜索结果：path / line / text</text><text x="376" y="162" font-size="16" fill="#182c45">最多 20 项、每行 240 字符</text><text x="376" y="184" font-size="16" fill="#182c45">truncated / lineTruncated</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">线索进入下一轮</text><text x="706" y="162" font-size="16" fill="#182c45">找到调用或定义位置</text><text x="706" y="184" font-size="16" fill="#182c45">不能自动证明调用关系</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">read_file 接收 path</text><text x="46" y="382" font-size="16" fill="#182c45">一次 workspace.read</text><text x="46" y="404" font-size="16" fill="#182c45">拿到当前完整源文本</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">输出路径及逐行编号</text><text x="376" y="382" font-size="16" fill="#182c45">行号从 1 开始</text><text x="376" y="404" font-size="16" fill="#182c45">原始业务函数不被执行</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">源码进入下一轮</text><text x="706" y="382" font-size="16" fill="#182c45">模型核对导出与调用</text><text x="706" y="404" font-size="16" fill="#182c45">应用 report 后再核对语义</text><text x="32" y="506" font-size="15" fill="#52667d">读取失败就反馈失败；不能用“没有命中”掩盖没有成功读完的搜索。</text></g></svg>