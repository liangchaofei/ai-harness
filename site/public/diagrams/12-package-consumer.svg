<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="三个包离开 workspace 后，仍由应用组装任务"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">三个包离开 workspace 后，仍由应用组装任务</text><text x="32" y="72" font-size="15" fill="#52667d">外部入口只导入公开包名；两次响应预写，文件读取与取消实际执行。</text><path d="M290 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M610 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M760 212L520 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M810 212L810 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="260" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">仓库 npm run build</text><text x="46" y="162" font-size="16" fill="#182c45">三个 dist 构建产物</text><text x="46" y="184" font-size="16" fill="#182c45">npm pack → 本地 tgz</text><rect x="360" y="110" width="250" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">全新消费目录</text><text x="376" y="162" font-size="16" fill="#182c45">离线安装三个 tgz</text><text x="376" y="184" font-size="16" fill="#182c45">自己的 main.mjs + source.ts</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">应用 runAgent</text><text x="706" y="162" font-size="16" fill="#182c45">注入 model.stream 连接</text><text x="706" y="184" font-size="16" fill="#182c45">coding-tools 读本地材料</text><rect x="360" y="330" width="250" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">正常：结果进入下一轮</text><text x="376" y="382" font-size="16" fill="#182c45">answered / modelCalls 2</text><text x="376" y="404" font-size="16" fill="#182c45">实际文件证据为 true</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">tool_end 取消</text><text x="706" y="382" font-size="16" fill="#182c45">cancelled / modelCalls 1</text><text x="706" y="404" font-size="16" fill="#182c45">保留结果，不开始下一轮</text><text x="32" y="506" font-size="15" fill="#52667d">只有 Node 包消费与控制证据；不表示桌面进程通信或生产 SDK 已完成。</text></g></svg>