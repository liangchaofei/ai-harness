<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" role="img" aria-label="第四轮：只改变摘要是否可见"><rect width="900" height="354" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="44" font-size="26" font-weight="700">第四轮：只改变摘要是否可见</text><rect x="28" y="63" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="94" font-size="21" font-weight="700">共同输入：任务 + 最近完整批次</text><text x="48" y="123" font-size="18">check_partial 原始反馈已省略；近期通过验收仍在</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">cut-only：移除摘要</text><text x="48" y="216" font-size="18">找不到第一次失败的用例 → 探针报告缺依据</text><rect x="28" y="249" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="280" font-size="21" font-weight="700">summary：保留摘要</text><text x="48" y="309" font-size="18">找到 /、index: 6、id: check_partial → 固定观察完成</text></g></svg>
