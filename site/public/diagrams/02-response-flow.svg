<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880" role="img"><title>deepseek-response：从未知响应到明确消息</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#64748b"/></marker></defs><rect width="1080" height="880" fill="#f8fafc"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="42" font-size="26" fill="#172554" font-weight="700">deepseek-response：从未知响应到明确消息</text><text x="30" y="76" font-size="17" fill="#334155">按当前候选函数顺序展示；各检查失败时走右侧出口。</text><rect x="30" y="110" width="735" height="95" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="142" font-size="21" fill="#334155" font-weight="700">① 原始 value：unknown</text><text x="50" y="176" font-size="17" fill="#334155">检查 choices[0]，取得 reason 与 message</text><path d="M397 205 L397 245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="250" width="735" height="110" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="282" font-size="21" fill="#334155" font-weight="700">② 检查停止原因与 assistant 消息</text><text x="50" y="316" font-size="17" fill="#334155">支持 stop / length / tool_calls</text><text x="50" y="344" font-size="17" fill="#334155">content 只接受字符串或 null</text><path d="M397 360 L397 400" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="405" width="735" height="145" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="437" font-size="21" fill="#334155" font-weight="700">③ decodeToolCalls：逐项转换</text><text x="50" y="471" font-size="17" fill="#334155">无字段 → []；有数组 → 保留每项 ID、名称和参数</text><text x="50" y="499" font-size="17" fill="#334155">检查 function 类型、非空身份、参数为字符串</text><text x="50" y="527" font-size="17" fill="#334155">同一列表内 ID 不重复；不解析 JSON，不执行</text><path d="M397 550 L397 590" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="595" width="735" height="110" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="627" font-size="21" fill="#334155" font-weight="700">④ 核对原因与请求是否一致</text><text x="50" y="661" font-size="17" fill="#334155">tool_calls 必须有请求；stop 不能附带请求</text><text x="50" y="689" font-size="17" fill="#334155">length 保留原状态，不升级为可用动作</text><path d="M397 705 L397 745" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="750" width="735" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="782" font-size="21" fill="#334155" font-weight="700">⑤ 返回 AssistantMessage</text><text x="50" y="816" font-size="17" fill="#334155">null → 空字符串；tool_calls → toolUse；附上请求列表</text><rect x="820" y="305" width="230" height="170" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="840" y="337" font-size="21" fill="#334155" font-weight="700">检查失败</text><text x="840" y="371" font-size="17" fill="#334155">抛异常给 complete</text><text x="840" y="399" font-size="17" fill="#334155">再交给应用 catch</text><text x="840" y="427" font-size="17" fill="#334155">不伪造正常结果</text><path d="M765 158 L790 158 L790 355 L815 355" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M765 305 L815 355" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M765 475 L815 420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M765 650 L790 650 L790 450 L815 450" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/></g></svg>