<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 225" role="img" aria-labelledby="title"><title id="title">用临时目录观察三种状态</title><rect width="640" height="225" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="34" font-size="22" font-weight="700">用临时目录观察三种状态</text><rect x="20" y="52" width="600" height="42" rx="8" fill="#e0edfc"/><text x="34" y="79" font-size="17">首次 claimCheck：undefined，获得占用</text><rect x="20" y="107" width="600" height="42" rx="8" fill="#fff0d9"/><text x="34" y="134" font-size="17">第二次 claimCheck：只有 .started，结果不明</text><rect x="20" y="162" width="600" height="42" rx="8" fill="#e0f1e9"/><text x="34" y="189" font-size="17">保存人工回执后再次读取：得到原来的 passed 与 feedback</text></g></svg>
