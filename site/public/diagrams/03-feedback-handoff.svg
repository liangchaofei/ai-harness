<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-label="一次工具反馈如何进入第二次模型调用"><rect width="900" height="356" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="42" font-size="25" font-weight="700">一次工具反馈如何进入第二次模型调用</text><rect x="28" y="62" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="93" font-size="21" font-weight="700">第一次 complete → first</text><text x="48" y="122" font-size="18">assistant 消息包含 call_01；应用先把 first 追加到 messages。</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">executeTools → results</text><text x="48" y="216" font-size="18">工具真实执行，返回带 toolCallId: call_01 的结果；执行器不更新历史。</text><rect x="28" y="250" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="281" font-size="21" font-weight="700">应用 push(...results) → 第二次 complete</text><text x="48" y="310" font-size="18">此时 messages 才包含任务、工具请求和对应反馈。</text></g></svg>
