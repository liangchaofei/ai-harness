<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title desc">
<title id="title">本地传输：固定响应，真实编解码与文件读取</title><desc id="desc">观察入口不加载 .env，也不包含网络回退；服务动作与最终文字均预写。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1080" height="790" fill="#f8fafc"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="28" font-weight="700">本地传输：固定响应，真实编解码与文件读取</text>
<text x="40" y="86" font-size="19" fill="#475569">观察入口不加载 .env，也不包含网络回退；服务动作与最终文字均预写。</text>
<rect x="40" y="118" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="152" font-size="23" font-weight="700">准备：createProtocolFetch(provider)</text>
<text x="62" y="185" font-size="20">按 deepseek / anthropic 选择固定 JSON 文件，读取样本数组。</text>
<text x="62" y="215" font-size="20">创建 index = 0，返回一个闭包函数；样本位置只属于这个本地传输。</text>
<path d="M 540 247 L 540 264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="268" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="302" font-size="23" font-weight="700">调用：适配器把完整 HTTP 请求交给本地函数</text>
<text x="62" y="335" font-size="20">核对固定 endpoint、正文和样本数量；只打印正文，不打印请求头。</text>
<text x="62" y="365" font-size="20">不符就抛出；不会改用 globalThis.fetch 请求模型。</text>
<path d="M 540 397 L 540 414" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="418" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="452" font-size="23" font-weight="700">返回：用第 index 项创建本地 Response</text>
<text x="62" y="485" font-size="20">取 samples[index] 并推进 index → 打印固定响应 → 返回 Response。</text>
<text x="62" y="515" font-size="20">适配器继续 response.json() 和解码，Runtime 接到统一消息。</text>
<path d="M 540 547 L 540 564" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="568" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="602" font-size="23" font-weight="700">下一轮：原 Runtime 再调用同一个模型函数</text>
<text x="62" y="635" font-size="20">第一份样本请求 read_file，工具真正读取允许清单中的文件。</text>
<text x="62" y="665" font-size="20">第二次编码包含读取结果，再取得第二份预写文本；不是模型自主判断。</text>
<text x="40" y="738" font-size="18" fill="#475569">这里观察协议和执行机制；真实服务账户、网络及任务质量仍需另行验证。</text></g></svg>