<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="固定观察：实际失败后，计划怎么改变"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">固定观察：实际失败后，计划怎么改变</text><text x="32" y="72" font-size="15" fill="#52667d">动作预写；文件、验收、更新保存与反馈均实际执行，不代表自主规划效果。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 212L250 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">读取已知invoice原文</text><text x="46" y="162" font-size="16" fill="#182c45">初始计划revision1</text><text x="46" y="184" font-size="16" fill="#182c45">步骤：删除折扣乘数</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">实际修改为return subtotal</text><text x="376" y="162" font-size="16" fill="#182c45">真实run_check失败</text><text x="376" y="184" font-size="16" fill="#182c45">actual1000 / expected900</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">失败反馈进入下一轮</text><text x="706" y="162" font-size="16" fill="#182c45">revision2：修订步骤</text><text x="706" y="184" font-size="16" fill="#182c45">改成保留一次折扣</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">实际修正并重新验收</text><text x="46" y="382" font-size="16" fill="#182c45">actual900 / expected900</text><text x="46" y="404" font-size="16" fill="#182c45">得到真实passed反馈</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">revision3：声明步骤完成</text><text x="376" y="382" font-size="16" fill="#182c45">再返回固定总结</text><text x="376" y="404" font-size="16" fill="#182c45">共5次模型 / 8项工具</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">应用重新取当前文件</text><text x="706" y="382" font-size="16" fill="#182c45">匹配15的实际检查来源</text><text x="706" y="404" font-size="16" fill="#182c45">满足接受条件才accepted</text><text x="32" y="506" font-size="15" fill="#52667d">固定样本只读已知计算文件，跳过自主发现；真实任务仍由模型选择完整调查。</text></g></svg>