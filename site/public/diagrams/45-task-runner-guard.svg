<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 207" role="img" aria-labelledby="title">
<title id="title">runner 怎样避免交叉使用状态</title>
<defs><marker id="end" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#465470"/></marker></defs>
<rect width="880" height="207" rx="16" fill="#f3f5fa"/>
<g font-family="system-ui, PingFang SC, sans-serif" fill="#192642">
<text x="28" y="49" font-size="25" font-weight="700">runner 怎样避免交叉使用状态</text>
<rect x="28" y="80" width="248" height="71" rx="11" fill="#ffffff" stroke="#aab3c2" stroke-width="2"/><text x="152" y="110" font-size="20" font-weight="700" text-anchor="middle">空闲状态</text><text x="152" y="135" font-size="15" text-anchor="middle">先绑定一份任务会话</text><path d="M280 116 H310" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="316" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="440" y="110" font-size="20" font-weight="700" text-anchor="middle">运行或审阅中</text><text x="440" y="135" font-size="15" text-anchor="middle">busy 防止重入</text><path d="M568 116 H598" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="604" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="728" y="110" font-size="20" font-weight="700" text-anchor="middle">运行结束</text><text x="728" y="135" font-size="15" text-anchor="middle">latest 只指向最近结果</text>
<text x="28" y="182" font-size="16">追问开始后旧结果无法再绑定当前审阅。</text>
</g></svg>
