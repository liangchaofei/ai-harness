<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="从任务JSON到同一次代码会话"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="500" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">从任务JSON到同一次代码会话</text><text x="32" y="72" font-size="15" fill="#52667d">例子：终端--task fixtures/code-tasks/cart.json；配置内路径以此JSON所在目录为准。</text><path d="M450 155L510 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 224L240 300" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M450 347L510 347" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="32" y="108" width="418" height="102" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="48" y="138" font-size="16" fill="#182c45">1  loadTask读取并检查四字段</text><text x="48" y="160" font-size="16" fill="#182c45">source: ../code-review</text><text x="48" y="182" font-size="16" fill="#182c45">checkScript: ./check-cart.mjs</text><rect x="510" y="108" width="418" height="102" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="526" y="138" font-size="16" fill="#182c45">2  解析可信来源与外置验收</text><text x="526" y="160" font-size="16" fill="#182c45">来源 → fixtures/code-review</text><text x="526" y="182" font-size="16" fill="#182c45">验收 → fixtures/code-tasks/check-cart.mjs</text><rect x="32" y="300" width="418" height="102" rx="10" fill="#fff0d3" stroke="#bac9d9"/><text x="48" y="330" font-size="16" fill="#182c45">3  prepareSession复制到临时目录</text><text x="48" y="352" font-size="16" fill="#182c45">root = 新副本；新增ESM包配置</text><text x="48" y="374" font-size="16" fill="#182c45">失败删除半成品，成功保留审阅</text><rect x="510" y="300" width="418" height="102" rx="10" fill="#e4f4eb" stroke="#bac9d9"/><text x="526" y="330" font-size="16" fill="#182c45">4  createCodeTaskSession</text><text x="526" y="352" font-size="16" fill="#182c45">root / writablePaths / 固定Node命令</text><text x="526" y="374" font-size="16" fill="#182c45">返回tools与inspect，共享私有验收</text><text x="32" y="476" font-size="15" fill="#52667d">材料与脚本必须可信；复制目录和脚本外置不提供OS沙箱。</text></g></svg>