<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 333" role="img" aria-labelledby="title desc">
  <title id="title">第四轮的四段输入如何拼接</title>
  <desc id="desc">boundary 为一。selected 的头部是任务，尾部是近期完整批次。memory 和 summary 插在两段之间。prepareMessages 返回拼好的 input，原始历史仍由 Runtime 保存。</desc>
  <rect width="640" height="333" rx="16" fill="#f3f7fb"/>
  <g font-family="system-ui,sans-serif" fill="#183149">
    <text x="24" y="37" font-size="22" font-weight="700">第 4 轮 · boundary = 1</text>
    <text x="24" y="65" font-size="16">prepareMessages 按以下顺序拼出 input</text>
    <rect x="24" y="84" width="592" height="43" rx="8" fill="#e0edfc"/>
    <rect x="24" y="135" width="592" height="43" rx="8" fill="#e0f1e9"/>
    <rect x="24" y="186" width="592" height="43" rx="8" fill="#fff0d9"/>
    <rect x="24" y="237" width="592" height="43" rx="8" fill="#e0edfc"/>
    <g font-size="17">
      <text x="42" y="111">selected.slice(0, 1)</text><text x="312" y="111">原任务</text>
      <text x="42" y="162">memory</text><text x="312" y="162">外部笔记：优先核对根路径 /</text>
      <text x="42" y="213">summary</text><text x="312" y="213">本次历史：早期验收的失败用例</text>
      <text x="42" y="264">selected.slice(1)</text><text x="312" y="264">近期完整批次：修正与验收通过</text>
    </g>
    <text x="24" y="308" font-size="16" font-weight="700">return input → Runtime 用它发送本轮请求</text>
  </g>
</svg>
