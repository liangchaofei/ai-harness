<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="策略对照与反例：进度不是验收"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">策略对照与反例：进度不是验收</text><text x="32" y="72" font-size="15" fill="#52667d">同材料 / 改法 / 实际检查 / 6次模型 / 8项工具 / 60秒；不开新额度。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">关闭计划：固定直接循环</text><text x="46" y="162" font-size="16" fill="#182c45">4次模型 / 5项工具</text><text x="46" y="184" font-size="16" fill="#182c45">2次修改，2次验收</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">开启计划：插入三次更新</text><text x="376" y="162" font-size="16" fill="#182c45">5次模型 / 8项工具</text><text x="376" y="184" font-size="16" fill="#182c45">相同修改、验收和最终答案</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">两者都实际接受</text><text x="706" y="162" font-size="16" fill="#182c45">比较输入字节与耗时</text><text x="706" y="184" font-size="16" fill="#182c45">不推导真实模型质量提升</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">另一个固定反例</text><text x="46" y="382" font-size="16" fill="#182c45">计划全部completed</text><text x="46" y="404" font-size="16" fill="#182c45">没有修改，也没有验收</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">运行仍可answered</text><text x="376" y="382" font-size="16" fill="#182c45">计划只是模型声明</text><text x="376" y="404" font-size="16" fill="#182c45">无changes / 无lastCheck</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">应用accepted false</text><text x="706" y="382" font-size="16" fill="#182c45">失败退出，副本保留</text><text x="706" y="404" font-size="16" fill="#182c45">默认关闭，按任务选用</text><text x="32" y="506" font-size="15" fill="#52667d">Context字节不是token或计费；真实自主任务对照仍待取证，不能把固定响应当模型表现。</text></g></svg>