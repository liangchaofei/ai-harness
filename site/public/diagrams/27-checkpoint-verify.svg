<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" role="img"><title>什么时候可以启动验收</title><rect width="640" height="256" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="18" y="30" font-size="21" font-weight="700">什么时候可以启动验收</text><rect x="18" y="48" width="604" height="52" rx="8" fill="#e0edfc"/><text x="32" y="69" font-size="18" font-weight="700">检查点 → 当前任务</text><text x="32" y="90" font-size="15">taskKey 比对来源路径、可写清单和验收脚本</text><path d="M320 102v8l-4-4m4 4l4-4" fill="none" stroke="#476783"/><rect x="18" y="112" width="604" height="52" rx="8" fill="#e0f1e9"/><text x="32" y="133" font-size="18" font-weight="700">检查点 → 当前副本</text><text x="32" y="154" font-size="15">当前 revision 与记录相等才继续</text><path d="M320 166v8l-4-4m4 4l4-4" fill="none" stroke="#476783"/><rect x="18" y="176" width="604" height="52" rx="8" fill="#fff0d9"/><text x="32" y="197" font-size="18" font-weight="700">独占占用 → 工具执行</text><text x="32" y="218" font-size="15">已有 .started 时拒绝再次执行</text></g></svg>
