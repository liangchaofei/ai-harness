<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="prepareModelInput：返回本轮输入，不改写历史"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#486784"/></marker></defs><rect width="960" height="520" rx="16" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#182c45"><text x="30" y="42" font-size="24" font-weight="700">prepareModelInput：返回本轮输入，不改写历史</text><text x="30" y="74" font-size="15" fill="#52667d">每次拟调用模型时执行；失败、取消或到期时不会继续启动模型。</text><rect x="30" y="120" width="270" height="105" rx="10" fill="#e1efff" stroke="#b6c8d9"/><text x="45" y="150" font-size="16">1 检查运行信号</text><text x="45" y="174" font-size="16">copyMessages(history)</text><text x="45" y="198" font-size="16">取得独立 snapshot</text><rect x="345" y="120" width="270" height="105" rx="10" fill="#e1efff" stroke="#b6c8d9"/><text x="360" y="150" font-size="16">2 等待应用回调</text><text x="360" y="174" font-size="16">没有回调 → 保留全量</text><text x="360" y="198" font-size="16">返回值由 selected 接住</text><rect x="660" y="120" width="270" height="105" rx="10" fill="#e1efff" stroke="#b6c8d9"/><text x="675" y="150" font-size="16">3 再检查运行信号</text><text x="675" y="174" font-size="16">检查返回非空数组</text><text x="675" y="198" font-size="16">不验证语义或工具配对</text><rect x="660" y="345" width="270" height="105" rx="10" fill="#e4f4eb" stroke="#b6c8d9"/><text x="675" y="375" font-size="16">4 复制 selected 消息</text><text x="675" y="399" font-size="16">组合 Context 并返回</text><text x="675" y="423" font-size="16">完整 history 保持原样</text><rect x="30" y="345" width="585" height="105" rx="10" fill="#fff0d3" stroke="#b6c8d9"/><text x="45" y="375" font-size="16">失败 → input / input_preparation；模型计数不增加</text><text x="45" y="399" font-size="16">运行停止 → cancelled 或 timedOut</text><text x="45" y="423" font-size="16">忽略信号且不结束的回调仍会等待；不是强杀</text><path d="M300 172H340" fill="none" stroke="#486784" stroke-width="2" marker-end="url(#arrow)"/><path d="M615 172H655" fill="none" stroke="#486784" stroke-width="2" marker-end="url(#arrow)"/><path d="M795 225V340" fill="none" stroke="#486784" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 225V285H320V340" fill="none" stroke="#486784" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="495" font-size="15" fill="#52667d">循环接住返回值 → input_prepared → model_start → callModel；仍在每个边界检查停止。</text></g></svg>