<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="修改以后，用真实验收反馈决定下一步"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">修改以后，用真实验收反馈决定下一步</text><text x="32" y="72" font-size="15" fill="#52667d">以下错误改法与修正次序为本地预写演示；文件修改和验收进程实际执行。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 212L250 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">模型读取副本源码与规则</text><text x="46" y="162" font-size="16" fill="#182c45">当前重复应用折扣</text><text x="46" y="184" font-size="16" fill="#182c45">提出 replace_text 请求</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">工具写入：return subtotal</text><text x="376" y="162" font-size="16" fill="#182c45">run_check 启动真实验收</text><text x="376" y="184" font-size="16" fill="#182c45">100 × 10 得 1000，预期 900</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">CheckResult.status: failed</text><text x="706" y="162" font-size="16" fill="#182c45">toolResult 仍成功取得观察</text><text x="706" y="184" font-size="16" fill="#182c45">Runtime 保存原 ID 与内容</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">下一轮 Context 带失败值</text><text x="46" y="382" font-size="16" fill="#182c45">模型提出另一项修改</text><text x="46" y="404" font-size="16" fill="#182c45">不只在终端显示错误</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">保留一次折扣并重新验收</text><text x="376" y="382" font-size="16" fill="#182c45">实际多组输入均通过</text><text x="376" y="404" font-size="16" fill="#182c45">status: passed / exitCode: 0</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">模型总结，运行停止</text><text x="706" y="382" font-size="16" fill="#182c45">保留副本与前后内容</text><text x="706" y="404" font-size="16" fill="#182c45">候选交给操作者审阅</text><text x="32" y="506" font-size="15" fill="#52667d">模型选择动作，工具执行，Runtime 保存反馈；某次验收通过不是最终版本证明。</text></g></svg>