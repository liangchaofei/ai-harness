<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 282" role="img" aria-labelledby="title desc">
  <title id="title">同一个工作副本上的两段运行</title>
  <desc id="desc">CLI 只准备一次副本。首段修复、验收并返回历史；CLI 追加用户追问。第二段接收历史和追问，继续使用原副本及验收状态。</desc>
  <rect width="660" height="282" rx="16" fill="#f3f7fb"/>
  <g font-family="system-ui,sans-serif" fill="#183149">
    <text x="22" y="38" font-size="22" font-weight="700">一次 CLI 运行 · 两段 Runtime 运行</text>
    <rect x="22" y="58" width="616" height="44" rx="9" fill="#e0edfc"/>
    <text x="38" y="86" font-size="17">prepareSession：只准备一次工作副本与工具</text>
    <rect x="22" y="112" width="616" height="44" rx="9" fill="#e0f1e9"/>
    <text x="38" y="140" font-size="17">首段：修复和验收 → first.messages</text>
    <rect x="22" y="166" width="616" height="44" rx="9" fill="#fff0d9"/>
    <text x="38" y="194" font-size="17">CLI：复制 first.messages，再追加一条用户追问</text>
    <rect x="22" y="220" width="616" height="44" rx="9" fill="#e0f1e9"/>
    <text x="38" y="248" font-size="17">第二段：用新历史起点调用 Runtime，沿用原副本</text>
  </g>
</svg>
