<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 252" role="img" aria-labelledby="title"><title id="title">写完首段，再接续追问</title><rect width="600" height="252" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="33" font-size="22" font-weight="700">写完首段，再接续追问</text><rect x="20" y="50" width="560" height="39" rx="8" fill="#e0edfc"/><text x="35" y="76" font-size="17">createSessionLog：写入版本和工作副本</text><rect x="20" y="98" width="560" height="39" rx="8" fill="#e0f1e9"/><text x="35" y="124" font-size="17">首段返回 → appendRun(first, 0)</text><rect x="20" y="146" width="560" height="39" rx="8" fill="#fff0d9"/><text x="35" y="172" font-size="17">追问返回 → appendRun(result, 11)</text><rect x="20" y="194" width="560" height="39" rx="8" fill="#e0edfc"/><text x="35" y="220" font-size="17">两次写入共用一个会话文件</text></g></svg>
