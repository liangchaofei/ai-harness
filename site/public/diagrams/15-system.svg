<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="交付判断：当前修改是否有对应验收"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">交付判断：当前修改是否有对应验收</text><text x="32" y="72" font-size="15" fill="#52667d">模型选择动作；Runtime执行并保存反馈；代码任务会话提供实际来源。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 212L250 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">应用创建 CodeTaskSession</text><text x="46" y="162" font-size="16" fill="#182c45">初始原文 → baseline</text><text x="46" y="184" font-size="16" fill="#182c45">tools交给原runAgent</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">模型 → 替换 / 验收请求</text><text x="376" y="162" font-size="16" fill="#182c45">工具修改副本并实际检查</text><text x="376" y="184" font-size="16" fill="#182c45">Runtime保存toolResult</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">会话私有lastCheck</text><text x="706" y="162" font-size="16" fill="#182c45">实际退出码与输出</text><text x="706" y="184" font-size="16" fill="#182c45">revision + stable</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">停止后：应用调用inspect</text><text x="46" y="382" font-size="16" fill="#182c45">重读当前内容，不信总结</text><text x="46" y="404" font-size="16" fill="#182c45">比较基线得到changes</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">比较当前与检查内容标识</text><text x="376" y="382" font-size="16" fill="#182c45">通过后再改：不再匹配</text><text x="376" y="404" font-size="16" fill="#182c45">重验才能支持新内容</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">应用acceptRepair</text><text x="706" y="382" font-size="16" fill="#182c45">变化 / 匹配 / 业务通过</text><text x="706" y="404" font-size="16" fill="#182c45">展示并返回accepted</text><text x="32" y="506" font-size="15" fill="#52667d">lastCheck与changes是代码任务状态；消息历史仍由Runtime持有；副本不自动合入。</text></g></svg>