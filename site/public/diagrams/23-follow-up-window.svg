<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 235" role="img" aria-labelledby="title desc">
  <title id="title">最新追问在输入过小时仍然保留</title>
  <desc id="desc">原任务一直保留，首段回答可被省略。最新追问单独保留。最后一个工具批次包括助手请求和工具反馈，两个消息一同保留。</desc>
  <rect width="660" height="235" rx="16" fill="#f3f7fb"/>
  <g font-family="system-ui,sans-serif" fill="#183149">
    <text x="22" y="38" font-size="22" font-weight="700">小目标下的消息选择</text>
    <rect x="22" y="61" width="141" height="73" rx="9" fill="#e0edfc"/>
    <rect x="176" y="61" width="141" height="73" rx="9" fill="#e4e8ec"/>
    <rect x="330" y="61" width="141" height="73" rx="9" fill="#fff0d9"/>
    <rect x="484" y="61" width="154" height="73" rx="9" fill="#e0f1e9"/>
    <g font-size="18" font-weight="700">
      <text x="36" y="92">原任务</text>
      <text x="190" y="92">首段回答</text>
      <text x="344" y="92">最新追问</text>
      <text x="498" y="92">验收工具批次</text>
    </g>
    <g font-size="15">
      <text x="36" y="117">保留</text><text x="190" y="117">省略</text>
      <text x="344" y="117">保留</text><text x="498" y="117">请求和反馈都保留</text>
      <text x="22" y="170">followUpIndex 指向追问。近期窗口先从最后一批开始。</text>
      <text x="22" y="202">窗口若已包含追问，就从窗口取一次。</text>
    </g>
  </g>
</svg>
