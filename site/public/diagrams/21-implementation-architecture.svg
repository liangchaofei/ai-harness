<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 329" role="img" aria-labelledby="title"><title id="title">省略的失败证据怎样回到模型输入</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#45637c"/></marker></defs><rect width="640" height="329" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="35" font-size="22" font-weight="700">省略的失败证据怎样回到模型输入</text><rect x="20" y="56" width="600" height="64" rx="9" fill="#e0edfc"/><text x="36" y="81" font-size="20" font-weight="700">Runtime → CLI 的 prepareMessages</text><text x="36" y="105" font-size="17">完整历史含 check_partial；裁剪后只保留近期批次</text><path d="M320 120v21" marker-end="url(#arrow)" stroke="#45637c" stroke-width="2"/><rect x="20" y="143" width="600" height="64" rx="9" fill="#e0f1e9"/><text x="36" y="168" font-size="20" font-weight="700">CLI → summarizeChecks</text><text x="36" y="192" font-size="17">从原反馈取出失败用例 /、历史下标和请求 ID</text><path d="M320 207v21" marker-end="url(#arrow)" stroke="#45637c" stroke-width="2"/><rect x="20" y="230" width="600" height="64" rx="9" fill="#fff0d9"/><text x="36" y="255" font-size="20" font-weight="700">Runtime → 模型</text><text x="36" y="279" font-size="17">原任务 → 验收摘要 → 近期完整工具批次</text></g></svg>
