<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-label="同一个Coding CLI，接入新的页面路径任务"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="490" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">同一个Coding CLI，接入新的页面路径任务</text><text x="32" y="72" font-size="15" fill="#52667d">本篇检验阶段三累计能力；新增的是材料和配套，核心不识别任务名。</text><path d="M308 155L342 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M618 155L652 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M480 192L480 306" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M342 347L308 347" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M618 347L652 347" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="32" y="112" width="276" height="80" rx="10" fill="#fff0d3" stroke="#bac9d9"/><text x="48" y="142" font-size="16" fill="#182c45">新材料 / 任务JSON</text><text x="48" y="164" font-size="16" fill="#182c45">README、入口、当前及历史</text><rect x="342" y="112" width="276" height="80" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="358" y="142" font-size="16" fill="#182c45">原apps/coding-cli</text><text x="358" y="164" font-size="16" fill="#182c45">配置→副本→进度→交付</text><rect x="652" y="112" width="276" height="80" rx="10" fill="#e4f4eb" stroke="#bac9d9"/><text x="668" y="142" font-size="16" fill="#182c45">操作者审阅</text><text x="668" y="164" font-size="16" fill="#182c45">实际变化 / 验收 / 退出码</text><rect x="32" y="306" width="276" height="80" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="48" y="336" font-size="16" fill="#182c45">原模型包</text><text x="48" y="358" font-size="16" fill="#182c45">服务请求与完整消息</text><rect x="342" y="306" width="276" height="80" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="358" y="336" font-size="16" fill="#182c45">原Runtime</text><text x="358" y="358" font-size="16" fill="#182c45">循环 / 历史 / 信号 / 预算</text><rect x="652" y="306" width="276" height="80" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="668" y="336" font-size="16" fill="#182c45">原代码工具会话</text><text x="668" y="358" font-size="16" fill="#182c45">读写 / 固定验收 / 内容取证</text><text x="32" y="466" font-size="15" fill="#52667d">应用预算8次模型 / 12项工具 / 60秒；计划默认关；真实模型轨迹与固定观察分别取证。</text></g></svg>