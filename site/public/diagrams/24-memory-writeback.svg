<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-labelledby="title"><title id="title">从本次验收到下一次任务</title><rect width="660" height="270" rx="16" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="39" font-size="23" font-weight="700">从本次验收到下一次任务</text><rect x="24" y="60" width="612" height="40" rx="8" fill="#e0edfc"/><text x="40" y="86" font-size="17">第一次任务 → 当前副本验收通过</text><rect x="24" y="109" width="612" height="40" rx="8" fill="#e0f1e9"/><text x="40" y="135" font-size="17">reportSession → accepted 为 true 才进入写入</text><rect x="24" y="158" width="612" height="40" rx="8" fill="#fff0d9"/><text x="40" y="184" font-size="17">saveAcceptedMemory → 将根路径用例写入笔记文件</text><rect x="24" y="207" width="612" height="40" rx="8" fill="#e0edfc"/><text x="40" y="233" font-size="17">第二次任务 → loadTaskMemory 重新读取旧线索</text></g></svg>
