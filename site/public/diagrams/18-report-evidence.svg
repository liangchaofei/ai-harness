<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-label="reportSession：三个位置提供不同证据"><rect width="900" height="356" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="42" font-size="25" font-weight="700">reportSession：三个位置提供不同证据</text><rect x="28" y="62" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="93" font-size="21" font-weight="700">assistant.toolCalls</text><text x="48" y="122" font-size="18">记录模型提出 run_check；只有请求时不能确认执行。</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">toolResult.toolCallId</text><text x="48" y="216" font-size="18">同 ID 的反馈记录实际处理结果；isError: false 不等于用例通过。</text><rect x="28" y="250" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="281" font-size="21" font-weight="700">inspect() → acceptTask</text><text x="48" y="310" font-size="18">重新核对当前内容、验收来源和结果，才决定是否接受。</text></g></svg>
