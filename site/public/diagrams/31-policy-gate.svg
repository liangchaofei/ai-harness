<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 226" role="img"><title>执行入口怎样决定是否产生动作</title><rect width="620" height="226" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="32" font-size="22" font-weight="700">执行入口怎样决定是否产生动作</text><rect x="20" y="49" width="580" height="40" rx="8" fill="#e0edfc"/><text x="34" y="75" font-size="17">readableTools.has(read_file) → 原工具 → 读取入口文件</text><path d="M310 90v10l-4-4m4 4l4-4" fill="none" stroke="#48637b"/><rect x="20" y="103" width="580" height="40" rx="8" fill="#fff0d9"/><text x="34" y="129" font-size="17">readableTools.has(replace_text) 为 false → 替换 execute</text><path d="M310 144v10l-4-4m4 4l4-4" fill="none" stroke="#48637b"/><rect x="20" y="157" width="580" height="40" rx="8" fill="#e0f1e9"/><text x="34" y="183" font-size="17">替换后的 execute 抛出 ToolExecutionError → 反馈给模型</text></g></svg>
