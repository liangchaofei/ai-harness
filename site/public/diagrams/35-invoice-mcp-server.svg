<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 207" role="img" aria-labelledby="title">
<title id="title">子进程里的两条规则查询路径</title>
<defs><marker id="end" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#465470"/></marker></defs>
<rect width="880" height="207" rx="16" fill="#f3f5fa"/>
<g font-family="system-ui, PingFang SC, sans-serif" fill="#192642">
<text x="28" y="49" font-size="25" font-weight="700">子进程里的两条规则查询路径</text>
<rect x="28" y="80" width="248" height="71" rx="11" fill="#ffffff" stroke="#aab3c2" stroke-width="2"/><text x="152" y="110" font-size="20" font-weight="700" text-anchor="middle">lookup_invoice_policy</text><text x="152" y="135" font-size="15" text-anchor="middle">收到 rule 参数</text><path d="M280 116 H310" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="316" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="440" y="110" font-size="20" font-weight="700" text-anchor="middle">bulk-discount</text><text x="440" y="135" font-size="15" text-anchor="middle">返回满 10 件九折规则</text><path d="M568 116 H598" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="604" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="728" y="110" font-size="20" font-weight="700" text-anchor="middle">其他规则编号</text><text x="728" y="135" font-size="15" text-anchor="middle">返回 isError: true</text>
<text x="28" y="182" font-size="16">两条路径都通过 MCP 协议回信。业务查询失败时，连接仍可继续使用。</text>
