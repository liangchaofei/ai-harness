<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img"><title>从已修改的副本接续验收</title><rect width="640" height="320" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="18" y="30" font-size="21" font-weight="700">从已修改的副本接续验收</text><rect x="18" y="48" width="604" height="52" rx="8" fill="#e0edfc"/><text x="32" y="69" font-size="18" font-weight="700">进程 A → savePendingCheck</text><text x="32" y="90" font-size="15">inspect 取得修改后的 revision，写入 pending.json</text><path d="M320 102v8l-4-4m4 4l4-4" fill="none" stroke="#476783"/><rect x="18" y="112" width="604" height="52" rx="8" fill="#e0f1e9"/><text x="32" y="133" font-size="18" font-weight="700">进程 B → resumePendingCheck</text><text x="32" y="154" font-size="15">重新打开同一个副本，检查 taskKey 和 revision</text><path d="M320 166v8l-4-4m4 4l4-4" fill="none" stroke="#476783"/><rect x="18" y="176" width="604" height="52" rx="8" fill="#fff0d9"/><text x="32" y="197" font-size="18" font-weight="700">CLI → run_check</text><text x="32" y="218" font-size="15">先独占创建 .started，再执行原任务配置的验收</text><path d="M320 230v8l-4-4m4 4l4-4" fill="none" stroke="#476783"/><rect x="18" y="240" width="604" height="52" rx="8" fill="#e0edfc"/><text x="32" y="261" font-size="18" font-weight="700">工具会话 → CLI</text><text x="32" y="282" font-size="15">inspect 核对本次验收对应的副本内容</text></g></svg>
