<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="固定响应装置：只替换网络，保留真实执行链"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">固定响应装置：只替换网络，保留真实执行链</text><text x="32" y="72" font-size="15" fill="#52667d">预写计划按次序响应，不自主解释任意反馈；recover 只检查预期失败反馈已进入请求。</text><path d="M290 155L360 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M610 155L690 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M420 207L225 325" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M500 207L500 325" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M810 207L810 325" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="105" width="260" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="135" font-size="16" fill="#182c45">plans.ts：预写项目消息</text><text x="46" y="157" font-size="16" fill="#182c45">review 两轮 / release 三轮</text><text x="46" y="179" font-size="16" fill="#182c45">recover 先加一条坏参数</text><rect x="360" y="105" width="250" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="135" font-size="16" fill="#182c45">fetch.ts：原生 SSE 样本</text><text x="376" y="157" font-size="16" fill="#182c45">编码 head 与最终 tail</text><text x="376" y="179" font-size="16" fill="#182c45">head 按 32 字节读取</text><rect x="690" y="105" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="135" font-size="16" fill="#182c45">normal / recover / budget</text><text x="706" y="157" font-size="16" fill="#182c45">交出完整 tail</text><text x="706" y="179" font-size="16" fill="#182c45">模型包生成完整消息</text><rect x="30" y="325" width="260" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="46" y="355" font-size="16" fill="#182c45">cutoff：不交出 tail</text><text x="46" y="377" font-size="16" fill="#182c45">响应体关闭</text><text x="46" y="399" font-size="16" fill="#182c45">模型包判断协议不完整</text><rect x="360" y="325" width="250" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="376" y="355" font-size="16" fill="#182c45">cancel / deadline</text><text x="376" y="377" font-size="16" fill="#182c45">tail 等待 400ms，可取消</text><text x="376" y="399" font-size="16" fill="#182c45">清理后交给 Runtime 停止</text><rect x="690" y="325" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="355" font-size="16" fill="#182c45">真实 Runtime 与工具</text><text x="706" y="377" font-size="16" fill="#182c45">实际参数校验 / 本地读取</text><text x="706" y="399" font-size="16" fill="#182c45">保存记录 → 应用报告</text><text x="32" y="506" font-size="15" fill="#52667d">live 不注入装置 fetch，改用原共享模型连接；真实服务由操作者自行决定是否调用。</text></g></svg>