<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 225" role="img" aria-labelledby="title"><title id="title">在真正执行的两侧记录证据</title><rect width="640" height="225" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="34" font-size="22" font-weight="700">在真正执行的两侧记录证据</text><rect x="20" y="52" width="600" height="42" rx="8" fill="#e0edfc"/><text x="34" y="79" font-size="17">claimCheck 返回回执 → reused: true，提前返回</text><rect x="20" y="107" width="600" height="42" rx="8" fill="#fff0d9"/><text x="34" y="134" font-size="17">claimCheck 独占成功 → 执行 run_check，再 inspect</text><rect x="20" y="162" width="600" height="42" rx="8" fill="#e0f1e9"/><text x="34" y="189" font-size="17">saveCheckReceipt 成功 → reused: false，返回本次结果</text></g></svg>
