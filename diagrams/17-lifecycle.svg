<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="一次运行：谁调用，谁保存，谁清理"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="520" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">一次运行：谁调用，谁保存，谁清理</text><text x="32" y="72" font-size="15" fill="#52667d">状态归属：Runtime持有历史，代码会话持有验收，CLI持有进程信号与会话句柄。</text><path d="M308 155L342 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M618 155L652 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M790 200L790 310" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M652 350L618 350" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M342 350L308 350" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="32" y="112" width="276" height="80" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="48" y="142" font-size="16" fill="#182c45">1  cli → runCli</text><text x="48" y="164" font-size="16" fill="#182c45">解析参数与任务，绑定服务</text><rect x="342" y="112" width="276" height="80" rx="10" fill="#fff0d3" stroke="#bac9d9"/><text x="358" y="142" font-size="16" fill="#182c45">2  prepare → runSession</text><text x="358" y="164" font-size="16" fill="#182c45">创建副本与会话，调用runAgent</text><rect x="652" y="112" width="276" height="80" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="668" y="142" font-size="16" fill="#182c45">3  原Runtime推进</text><text x="668" y="164" font-size="16" fill="#182c45">模型 → 工具 → 结果 → 下一轮</text><rect x="32" y="310" width="276" height="80" rx="10" fill="#e4f4eb" stroke="#bac9d9"/><text x="48" y="340" font-size="16" fill="#182c45">6  finally释放SIGINT监听</text><text x="48" y="362" font-size="16" fill="#182c45">已准备副本保留；返回退出码</text><rect x="342" y="310" width="276" height="80" rx="10" fill="#e4f4eb" stroke="#bac9d9"/><text x="358" y="340" font-size="16" fill="#182c45">5  reportSession / acceptTask</text><text x="358" y="362" font-size="16" fill="#182c45">当前变化＋匹配验收 → 接受判断</text><rect x="652" y="310" width="276" height="80" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="668" y="340" font-size="16" fill="#182c45">4  runAgent返回RunResult</text><text x="668" y="362" font-size="16" fill="#182c45">停止或取消 → 同会话inspect</text><text x="32" y="496" font-size="15" fill="#52667d">Ctrl+C → controller.abort → 原信号链；退出码0接受 / 1未接受 / 2启动或报告失败 / 130主动取消。</text></g></svg>