<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1090" viewBox="0 0 1080 1090" role="img" aria-labelledby="title desc">
<title id="title">一次调查：材料、领域 ID 与工具请求 ID</title><desc id="desc">一种可能轨迹；输入记录数不含模型包另加的 system 消息。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1080" height="1090" fill="#f8fafc"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="28" font-weight="700">一次调查：材料、领域 ID 与工具请求 ID</text>
<text x="40" y="86" font-size="19" fill="#475569">一种可能轨迹；输入记录数不含模型包另加的 system 消息。</text>
<rect x="40" y="118" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="152" font-size="23" font-weight="700">应用准备：读取 JSON，创建工具</text>
<text x="62" y="185" font-size="20">loadRecords → ID 到文本的 Map → createLookupTool → 两个 ExecutableTool。</text>
<text x="62" y="215" font-size="20">材料错误在启动阶段停止；成功后才由应用调用 runAgent。</text>
<path d="M 540 247 L 540 264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="268" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="302" font-size="23" font-weight="700">调用 1：模型只收到发布 ID 与工具说明</text>
<text x="62" y="335" font-size="20">请求 ID = call_release_01；工具 lookup_release；参数 id = release-42。</text>
<text x="62" y="365" font-size="20">查询工具返回 {id: release-42, record: 实际发布文本}，不是模型生成的记录。</text>
<path d="M 540 397 L 540 414" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="418" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="452" font-size="23" font-weight="700">Runtime 保存反馈，下一次输入有 3 条记录</text>
<text x="62" y="485" font-size="20">toolCallId = call_release_01，关联的是动作请求；内容里的 id 是领域记录。</text>
<text x="62" y="515" font-size="20">发布文本包含 checkout-api 和 inventory-api；下一次模型才据此继续调查。</text>
<path d="M 540 547 L 540 564" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="568" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="602" font-size="23" font-weight="700">调用 2：模型提出两个服务查询</text>
<text x="62" y="635" font-size="20">请求 call_service_02 / checkout-api 与 call_service_03 / inventory-api。</text>
<text x="62" y="665" font-size="20">executeTools 按顺序执行；原 assistant 保存一次，两项结果分别关联原请求。</text>
<path d="M 540 697 L 540 714" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="718" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="752" font-size="23" font-weight="700">调用 3：输入有 6 条记录，再生成摘要</text>
<text x="62" y="785" font-size="20">[用户，发布请求及结果，两个服务请求所在消息，两项服务结果]。</text>
<text x="62" y="815" font-size="20">返回文本后记录共 7 条；Runtime 返回 answered，应用检查三项成功查询。</text>

<rect x="40" y="868" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="902" font-size="23" font-weight="700">失败出口：材料准备与工具失败分别处理</text>
<text x="62" y="935" font-size="20">参数或 ID 错误 → ToolExecutionError → 已知失败反馈，可由模型提出新请求。</text>
<text x="62" y="965" font-size="20">未知异常、调用上限等仍由原 Runtime 停止；不通过补写业务分支继续。</text>
<text x="40" y="1038" font-size="18" fill="#475569">作者固定响应验证程序机制；真实模型的调用顺序、修正与答案质量需另看实际轨迹。</text></g></svg>