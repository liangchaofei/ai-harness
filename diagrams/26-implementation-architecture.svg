<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" role="img" aria-labelledby="title"><title id="title">已保存的会话怎样变成新问题的输入</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#45637c"/></marker></defs><rect width="640" height="416" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="35" font-size="22" font-weight="700">已保存的会话怎样变成新问题的输入</text><rect x="20" y="56" width="600" height="64" rx="9" fill="#e0edfc"/><text x="36" y="81" font-size="20" font-weight="700">旧 CLI → session.jsonl</text><text x="36" y="105" font-size="17">会话头、首段 11 条、追问段新增 2 条</text><path d="M320 120v21" marker-end="url(#arrow)" stroke="#45637c" stroke-width="2"/><rect x="20" y="143" width="600" height="64" rx="9" fill="#e0f1e9"/><text x="36" y="168" font-size="20" font-weight="700">新 CLI → readSessionHistory</text><text x="36" y="192" font-size="17">验证版本、运行段和工具配对，拼回 13 条历史</text><path d="M320 207v21" marker-end="url(#arrow)" stroke="#45637c" stroke-width="2"/><rect x="20" y="230" width="600" height="64" rx="9" fill="#fff0d9"/><text x="36" y="255" font-size="20" font-weight="700">resumeConversation → Runtime</text><text x="36" y="279" font-size="17">追加第 14 条用户问题，工具列表为空</text><path d="M320 294v21" marker-end="url(#arrow)" stroke="#45637c" stroke-width="2"/><rect x="20" y="317" width="600" height="64" rx="9" fill="#e0edfc"/><text x="36" y="342" font-size="20" font-weight="700">模型 → 新 CLI</text><text x="36" y="366" font-size="17">根据历史 check_complete 回答当时的验收结果</text></g></svg>
