<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="运行控制：先记录的停止原因固定"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">运行控制：先记录的停止原因固定</text><text x="32" y="72" font-size="15" fill="#52667d">定时器负责等待中发信号；动作边界用经过时长补查到期。</text><path d="M290 155L360 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M290 190L360 295" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M610 155L690 200" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M610 295L690 230" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M810 262L810 350" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="260" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">创建：检查 timeoutMs</text><text x="46" y="162" font-size="16" fill="#182c45">记录 performance.now()</text><text x="46" y="184" font-size="16" fill="#182c45">安装外部监听 / 一次 timer</text><rect x="360" y="110" width="250" height="80" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">外部 abort</text><text x="376" y="162" font-size="16" fill="#182c45">尝试记录 cancelled</text><rect x="360" y="260" width="250" height="80" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="376" y="290" font-size="16" fill="#182c45">timer 或 stopStatus 检查</text><text x="376" y="312" font-size="16" fill="#182c45">到期 → 尝试记录 timedOut</text><rect x="690" y="160" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="190" font-size="16" fill="#182c45">stop(reason)</text><text x="706" y="212" font-size="16" fill="#182c45">只接受首次记录</text><text x="706" y="234" font-size="16" fill="#182c45">controller.abort()</text><rect x="690" y="350" width="240" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="706" y="380" font-size="16" fill="#182c45">选定停止 / 外层 finally</text><text x="706" y="402" font-size="16" fill="#182c45">dispose：清 timer、监听</text><text x="706" y="424" font-size="16" fill="#182c45">重复清理安全</text><text x="32" y="506" font-size="15" fill="#52667d">正常完成也会清理；内部到期不会反向取消应用的 controller。</text></g></svg>