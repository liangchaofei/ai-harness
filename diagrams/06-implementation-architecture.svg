<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 329" role="img" aria-labelledby="title"><title id="title">两个提供商共用一个 Runtime</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#45637c"/></marker></defs><rect width="640" height="329" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="35" font-size="22" font-weight="700">两个提供商共用一个 Runtime</text><rect x="20" y="56" width="600" height="64" rx="9" fill="#e0edfc"/><text x="36" y="81" font-size="20" font-weight="700">应用 → Runtime</text><text x="36" y="105" font-size="17">同一个代码审查任务，由应用选择服务</text><path d="M320 120v21" marker-end="url(#arrow)" stroke="#45637c" stroke-width="2"/><rect x="20" y="143" width="600" height="64" rx="9" fill="#e0f1e9"/><text x="36" y="168" font-size="20" font-weight="700">模型包 ↔ 所选服务</text><text x="36" y="192" font-size="17">DeepSeek 或 Anthropic 适配器编码和解码</text><path d="M320 207v21" marker-end="url(#arrow)" stroke="#45637c" stroke-width="2"/><rect x="20" y="230" width="600" height="64" rx="9" fill="#fff0d9"/><text x="36" y="255" font-size="20" font-weight="700">模型包 → Runtime</text><text x="36" y="279" font-size="17">统一的 AssistantMessage → 工具执行与反馈</text></g></svg>
