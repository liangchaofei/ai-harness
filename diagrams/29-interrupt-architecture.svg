<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 263" role="img" aria-labelledby="title"><title id="title">一次受控中断的三个参与方</title><rect width="600" height="263" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="32" font-size="22" font-weight="700">一次受控中断的三个参与方</text><rect x="20" y="48" width="560" height="40" rx="8" fill="#e0edfc"/><text x="34" y="74" font-size="17">实验入口 → 启动恢复 CLI</text><rect x="20" y="100" width="560" height="40" rx="8" fill="#e0f1e9"/><text x="34" y="126" font-size="17">恢复 CLI → .started → 启动验收子进程</text><rect x="20" y="152" width="560" height="40" rx="8" fill="#fff0d9"/><text x="34" y="178" font-size="17">验收子进程 → .probe-started → 等待放行</text><rect x="20" y="204" width="560" height="40" rx="8" fill="#e0edfc"/><text x="34" y="230" font-size="17">实验入口 → 等 CLI 退出 → 放行 → 核对磁盘证据</text></g></svg>
