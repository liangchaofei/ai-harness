<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 215" role="img"><title>同一 CLI 的两个入口</title><rect width="600" height="215" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="36" font-size="22" font-weight="700">同一 CLI 的两个入口</text><rect x="20" y="55" width="560" height="40" rx="8" fill="#e0edfc"/><text x="35" y="82" font-size="18">--task → 加载任务与准备副本</text><rect x="20" y="107" width="560" height="40" rx="8" fill="#fff0d9"/><text x="35" y="134" font-size="18">--resume-log + --follow-up → 读取历史</text><rect x="20" y="159" width="560" height="40" rx="8" fill="#e0f1e9"/><text x="35" y="186" font-size="18">接续分支返回后结束本次 CLI</text></g></svg>
