<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="本地观察：同一取消机制，三条可重复轨迹"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">本地观察：同一取消机制，三条可重复轨迹</text><text x="32" y="72" font-size="15" fill="#52667d">响应与等待由示例预设；Runtime、流读取器和 read_file 使用实际实现。</text><path d="M165 212L165 315" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M480 212L480 315" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M795 212L795 315" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">model：固定 HTTP 预览</text><text x="46" y="162" font-size="16" fill="#182c45">20ms 后 abort()</text><text x="46" y="184" font-size="16" fill="#182c45">响应体 error → 清理计时器</text><rect x="345" y="110" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="361" y="140" font-size="16" fill="#182c45">tools：固定模型批次</text><text x="361" y="162" font-size="16" fill="#182c45">真实 read_1 → wait_2</text><text x="361" y="184" font-size="16" fill="#182c45">delay 接收 signal → finally</text><rect x="660" y="110" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="676" y="140" font-size="16" fill="#182c45">late：相同固定批次</text><text x="676" y="162" font-size="16" fill="#182c45">wait_2 忽略 signal</text><text x="676" y="184" font-size="16" fill="#182c45">等待完成后才返回</text><rect x="30" y="315" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="345" font-size="16" fill="#182c45">Runtime：取消模型等待</text><text x="46" y="367" font-size="16" fill="#182c45">预览不进入 messages</text><text x="46" y="389" font-size="16" fill="#182c45">读取次数 0；调用次数 1</text><rect x="345" y="315" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="361" y="345" font-size="16" fill="#182c45">Runtime：只保存 read_1</text><text x="361" y="367" font-size="16" fill="#182c45">wait_2 无结果；read_3 未开始</text><text x="361" y="389" font-size="16" fill="#182c45">读取次数 1；调用次数 1</text><rect x="660" y="315" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="676" y="345" font-size="16" fill="#182c45">Runtime：丢弃迟到结果</text><text x="676" y="367" font-size="16" fill="#182c45">wait_2 无结果；read_3 未开始</text><text x="676" y="389" font-size="16" fill="#182c45">读取次数 1；调用次数 1</text><text x="32" y="506" font-size="15" fill="#52667d">三条轨迹都返回 cancelled；late 较晚停止，证明信号并不强杀任意函数。</text></g></svg>