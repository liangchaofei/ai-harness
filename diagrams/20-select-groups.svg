<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" role="img" aria-label="selectInput：按完整批次选择"><rect width="900" height="354" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="44" font-size="26" font-weight="700">selectInput：按完整批次选择</text><rect x="28" y="63" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="94" font-size="21" font-weight="700">groupHistory：assistant → 两条 toolResult</text><text x="48" y="123" font-size="18">pending 用请求 ID 配对；缺项、重复或孤立结果都会停止准备。</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">task 固定保留；recent 从最后一组开始</text><text x="48" y="216" font-size="18">按组向前试放，第一次放不下就停，不跳选更早的记录。</text><rect x="28" y="249" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="280" font-size="21" font-weight="700">最小集合已经超额</text><text x="48" y="309" font-size="18">仍保留任务和最后一组；报告 overBudget，不拆开批次。</text></g></svg>
