<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="一次运行：取消源与执行状态各归其主"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">一次运行：取消源与执行状态各归其主</text><text x="32" y="72" font-size="15" fill="#52667d">应用能请求停止；模型和工具协作退出；Runtime 决定保存与停止。</text><path d="M280 155L370 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="331.0" y="148.0" font-size="14" fill="#52667d">signal</text><path d="M425 222L170 320" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="303.5" y="264.0" font-size="14" fill="#52667d">传递</text><path d="M495 222L495 320" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M620 170L720 220" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="676.0" y="188.0" font-size="14" fill="#52667d">停止结果</text><rect x="30" y="120" width="250" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="150" font-size="16" fill="#182c45">应用：AbortController</text><text x="46" y="172" font-size="16" fill="#182c45">Ctrl+C → abort()</text><text x="46" y="194" font-size="16" fill="#182c45">finally → 移除 SIGINT 监听</text><rect x="370" y="120" width="250" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="386" y="150" font-size="16" fill="#182c45">Runtime：runAgent</text><text x="386" y="172" font-size="16" fill="#182c45">读取同一个 signal</text><text x="386" y="194" font-size="16" fill="#182c45">持有 messages / modelCalls</text><rect x="30" y="320" width="250" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="46" y="350" font-size="16" fill="#182c45">模型连接 → model</text><text x="46" y="372" font-size="16" fill="#182c45">signal 与 HTTP 超时合并</text><text x="46" y="394" font-size="16" fill="#182c45">fetch / 响应体退出</text><rect x="370" y="320" width="250" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="386" y="350" font-size="16" fill="#182c45">工具执行器 → 工具</text><text x="386" y="372" font-size="16" fill="#182c45">执行前后检查 signal</text><text x="386" y="394" font-size="16" fill="#182c45">文件句柄在 finally 关闭</text><rect x="690" y="220" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="250" font-size="16" fill="#182c45">Runtime → 应用</text><text x="706" y="272" font-size="16" fill="#182c45">status: cancelled</text><text x="706" y="294" font-size="16" fill="#182c45">只保留此前完整记录</text><text x="32" y="506" font-size="15" fill="#52667d">取消是运行控制支路；事件用于观察，返回值不会自动改写历史。</text></g></svg>