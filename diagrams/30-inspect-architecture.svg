<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-labelledby="title"><title id="title">诊断与恢复共用证据判断</title><rect width="620" height="214" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="32" font-size="22" font-weight="700">诊断与恢复共用证据判断</text><rect x="20" y="48" width="580" height="40" rx="8" fill="#e0edfc"/><text x="34" y="74" font-size="17">--inspect-check → openPendingCheck → 核对任务和副本</text><rect x="20" y="100" width="580" height="40" rx="8" fill="#e0f1e9"/><text x="34" y="126" font-size="17">inspectCheckReceipt → 返回 pending、completed 或 unknown</text><rect x="20" y="152" width="580" height="40" rx="8" fill="#fff0d9"/><text x="34" y="178" font-size="17">--resume-check → claimCheck → 决定复用、拒绝或独占执行</text></g></svg>
