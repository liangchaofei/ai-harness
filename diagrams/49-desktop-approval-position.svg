<text x="28" y="49" font-size="25" font-weight="700">第八阶段 · 把逐次批准接到桌面</text>
<rect x="28" y="80" width="248" height="71" rx="11" fill="#ffffff" stroke="#aab3c2" stroke-width="2"/><text x="152" y="110" font-size="20" font-weight="700" text-anchor="middle">模型提出工具调用</text><text x="152" y="135" font-size="15" text-anchor="middle">修改或运行验收</text><path d="M280 116 H310" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="316" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="440" y="110" font-size="20" font-weight="700" text-anchor="middle">执行前批准</text><text x="440" y="135" font-size="15" text-anchor="middle">本篇 · 主进程等待决定</text><path d="M568 116 H598" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="604" y="80" width="248" height="71" rx="11" fill="#ffffff" stroke="#aab3c2" stroke-width="2"/><text x="728" y="110" font-size="20" font-weight="700" text-anchor="middle">执行与审阅</text><text x="728" y="135" font-size="15" text-anchor="middle">受控工具执行，保留实际证据</text>
<text x="28" y="182" font-size="16">CLI 和桌面共用批准规则，各自选择如何向用户询问。</text>
