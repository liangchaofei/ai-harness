<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 207" role="img" aria-labelledby="title">
<title id="title">子运行的四个实际限制</title>
<defs><marker id="end" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#465470"/></marker></defs>
<rect width="880" height="207" rx="16" fill="#f3f5fa"/>
<g font-family="system-ui, PingFang SC, sans-serif" fill="#192642">
<text x="28" y="49" font-size="25" font-weight="700">子运行的四个实际限制</text>
<rect x="28" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="152" y="110" font-size="20" font-weight="700" text-anchor="middle">工具能力</text><text x="152" y="135" font-size="15" text-anchor="middle">只有 read_file</text><path d="M280 116 H310" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="316" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="440" y="110" font-size="20" font-weight="700" text-anchor="middle">运行额度</text><text x="440" y="135" font-size="15" text-anchor="middle">3 次模型 · 2 项工具</text><path d="M568 116 H598" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="604" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="728" y="110" font-size="20" font-weight="700" text-anchor="middle">生命周期</text><text x="728" y="135" font-size="15" text-anchor="middle">每父段一次 · 8 秒时限</text>
<text x="28" y="182" font-size="16">父工具取消信号向子运行传播，子工具列表中没有继续委派的入口。</text>
</g></svg>
