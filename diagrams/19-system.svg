<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-label="同一个循环，两份用途不同的消息"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#486784"/></marker></defs><rect width="960" height="510" rx="16" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#182c45"><text x="30" y="42" font-size="24" font-weight="700">同一个循环，两份用途不同的消息</text><text x="30" y="74" font-size="15" fill="#52667d">完整记录只保存事实；本轮输入由副本准备，默认保留全部历史。</text><rect x="30" y="120" width="270" height="130" rx="10" fill="#e4f4eb" stroke="#b6c8d9"/><text x="45" y="150" font-size="16">完整记录 messages</text><text x="45" y="174" font-size="16">用户任务 / 模型请求</text><text x="45" y="198" font-size="16">实际工具反馈</text><rect x="345" y="120" width="270" height="130" rx="10" fill="#e1efff" stroke="#b6c8d9"/><text x="360" y="150" font-size="16">独立副本 → 应用准备</text><text x="360" y="174" font-size="16">可选 prepareMessages</text><text x="360" y="198" font-size="16">临时提示只改变本轮输入</text><rect x="660" y="120" width="270" height="130" rx="10" fill="#e1efff" stroke="#b6c8d9"/><text x="675" y="150" font-size="16">本轮 Context</text><text x="675" y="174" font-size="16">系统要求 + 准备后消息</text><text x="675" y="198" font-size="16">实际工具说明</text><rect x="660" y="355" width="270" height="85" rx="10" fill="#e1efff" stroke="#b6c8d9"/><text x="675" y="385" font-size="16">原 callModel</text><text x="675" y="409" font-size="16">固定函数 / 模型包接入</text><rect x="345" y="355" width="270" height="85" rx="10" fill="#fff0d3" stroke="#b6c8d9"/><text x="360" y="385" font-size="16">完整 assistant 响应</text><text x="360" y="409" font-size="16">循环追加实际响应</text><path d="M300 185H340" fill="none" stroke="#486784" stroke-width="2" marker-end="url(#arrow)"/><path d="M615 185H655" fill="none" stroke="#486784" stroke-width="2" marker-end="url(#arrow)"/><path d="M795 250V350" fill="none" stroke="#486784" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 397H620" fill="none" stroke="#486784" stroke-width="2" marker-end="url(#arrow)"/><path d="M345 397H165V255" fill="none" stroke="#486784" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="486" font-size="15" fill="#52667d">工具分支仍按原执行器处理后写回记录；没有新增持久化或默认裁剪。</text></g></svg>