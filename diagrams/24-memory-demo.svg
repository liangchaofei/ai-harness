<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title"><title id="title">同一份笔记跨两次 CLI 运行</title><rect width="600" height="280" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="36" font-size="22" font-weight="700">同一份笔记跨两次 CLI 运行</text><rect x="20" y="56" width="560" height="62" rx="9" fill="#e0edfc"/><text x="36" y="79" font-size="18" font-weight="700">第一次 runCli</text><text x="36" y="102" font-size="16">新副本，首轮无记忆，验收后笔记变成 1 条</text><rect x="20" y="128" width="560" height="62" rx="9" fill="#e0f1e9"/><text x="36" y="151" font-size="18" font-weight="700">第二次 runCli</text><text x="36" y="174" font-size="16">另一个新副本，首轮从 notes.json 读到线索</text><rect x="20" y="200" width="560" height="62" rx="9" fill="#fff0d9"/><text x="36" y="223" font-size="18" font-weight="700">再次验收</text><text x="36" y="246" font-size="16">证据相同，返回 unchanged，文件仍有 1 条</text></g></svg>
