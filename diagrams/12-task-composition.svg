<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="任务成组替换：同一内核继续运行"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">任务成组替换：同一内核继续运行</text><text x="32" y="72" font-size="15" fill="#52667d">任务工厂只创建应用输入与报告函数；运行历史始终由 Runtime 保存。</text><path d="M300 155L360 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 155L690 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M760 212L600 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 370L690 370" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">材料：cart / invoice</text><text x="46" y="162" font-size="16" fill="#182c45">发布：original / stage</text><text x="46" y="184" font-size="16" fill="#182c45">业务文件留在 fixtures</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">两个任务工厂</text><text x="376" y="162" font-size="16" fill="#182c45">input：目标 + 工具范围</text><text x="376" y="184" font-size="16" fill="#182c45">report：闭包保留证据要求</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">应用入口 / 阶段入口</text><text x="706" y="162" font-size="16" fill="#182c45">选择模型、预算、观察</text><text x="706" y="184" font-size="16" fill="#182c45">启动同一个 runAgent</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">同一套模型 / Runtime / 工具</text><text x="376" y="382" font-size="16" fill="#182c45">原生 SSE / 校验 / 反馈</text><text x="376" y="404" font-size="16" fill="#182c45">事件 / 取消 / 期限 / 额度</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">应用接住 RunResult</text><text x="706" y="382" font-size="16" fill="#182c45">task.report(result)</text><text x="706" y="404" font-size="16" fill="#182c45">停止、证据、语义分别看</text><text x="32" y="506" font-size="15" fill="#52667d">ExampleTask 仅属于 examples；核心包没有 invoice、release-57 或任务报告分支。</text></g></svg>