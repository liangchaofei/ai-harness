<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="从任务入口调查：线索逐步进入下一轮"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">从任务入口调查：线索逐步进入下一轮</text><text x="32" y="72" font-size="15" fill="#52667d">示意轨迹，不规定真实模型必须按此顺序选择工具。</text><path d="M300 165L360 165" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 165L690 165" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M800 217L570 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="115" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="145" font-size="16" fill="#182c45">应用提供目标与工作区根</text><text x="46" y="167" font-size="16" fill="#182c45">已知入口 src/main.ts</text><text x="46" y="189" font-size="16" fill="#182c45">模型选择下一步工具</text><rect x="360" y="115" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="145" font-size="16" fill="#182c45">find_files：invoice</text><text x="376" y="167" font-size="16" fill="#182c45">checkout 与 legacy 两条路径</text><text x="376" y="189" font-size="16" fill="#182c45">名称相似不代表都在运行链</text><rect x="690" y="115" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="145" font-size="16" fill="#182c45">search_source：discountRate</text><text x="706" y="167" font-size="16" fill="#182c45">找到导入、调用和定义</text><text x="706" y="189" font-size="16" fill="#182c45">返回路径、行号和预览</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">read_file：完整相关源码</text><text x="376" y="382" font-size="16" fill="#182c45">入口 → checkout → policy</text><text x="376" y="404" font-size="16" fill="#182c45">实际内容附 1 起始行号</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">模型依据结果回答</text><text x="706" y="382" font-size="16" fill="#182c45">第 7 行重复折扣</text><text x="706" y="404" font-size="16" fill="#182c45">当前 810，正确 900</text><text x="32" y="506" font-size="15" fill="#52667d">每项工具结果由 Runtime 保存，再进入下一轮；应用最后检查材料证据与结论。</text></g></svg>