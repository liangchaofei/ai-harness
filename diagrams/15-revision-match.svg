<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-label="inspect：变化与验收来源分别核对"><rect width="900" height="356" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="42" font-size="25" font-weight="700">inspect：变化与验收来源分别核对</text><rect x="28" y="62" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="93" font-size="21" font-weight="700">baseline → current</text><text x="48" y="122" font-size="18">compareWorkspace 计算从任务开始到停止后取证的变化。</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">lastCheck.revision 与 current.revision</text><text x="48" y="216" font-size="18">验收期间内容稳定且标识相同：来源匹配；还要检查验收结果。</text><rect x="28" y="250" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="281" font-size="21" font-weight="700">内容再次变化</text><text x="48" y="310" font-size="18">即使旧记录显示通过，也不能把它当成当前内容的验收。</text></g></svg>
