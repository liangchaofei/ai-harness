<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-label="工具额度：用满与申请失败是两件事"><rect width="900" height="356" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="42" font-size="25" font-weight="700">工具额度：用满与申请失败是两件事</text><rect x="28" y="62" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="93" font-size="21" font-weight="700">恰好处理完 3 项</text><text x="48" y="122" font-size="18">本批结束后仍可调用模型；如果模型直接回答，不触发 toolLimit。</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">再有一项请求进入额度检查</text><text x="48" y="216" font-size="18">tryStartToolCall 拒绝；该项没有 tool_start，也不会执行。</text><rect x="28" y="250" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="281" font-size="21" font-weight="700">Runtime 接到 ToolBatchLimit</text><text x="48" y="310" font-size="18">追加此前已完成的结果，返回 toolLimit；不再启动下一轮。</text></g></svg>
