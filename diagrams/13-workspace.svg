<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="共享工作区：保存路径范围，不保存 Agent 历史"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">共享工作区：保存路径范围，不保存 Agent 历史</text><text x="32" y="72" font-size="15" fill="#52667d">应用选择根目录；coding-tools 管理文件环境；Runtime 继续管理运行。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M780 212L570 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">createWorkspaceTools({root})</text><text x="46" y="162" font-size="16" fill="#182c45">openWorkspace 准备索引</text><text x="46" y="184" font-size="16" fill="#182c45">最多 64 个普通 .ts 文件</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">同一个 Workspace</text><text x="376" y="162" font-size="16" fill="#182c45">paths：启动时路径集合</text><text x="376" y="184" font-size="16" fill="#182c45">read：每次复查并读当前内容</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">三个 ExecutableTool</text><text x="706" y="162" font-size="16" fill="#182c45">find_files / search_source</text><text x="706" y="184" font-size="16" fill="#182c45">read_file</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">应用把工具交给 runAgent</text><text x="376" y="382" font-size="16" fill="#182c45">原参数门禁与顺序执行</text><text x="376" y="404" font-size="16" fill="#182c45">execute(value, signal)</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">结果返回 Runtime</text><text x="706" y="382" font-size="16" fill="#182c45">原 ID → toolResult → push</text><text x="706" y="404" font-size="16" fill="#182c45">下一次 Context 带回反馈</text><text x="32" y="506" font-size="15" fill="#52667d">Workspace 不包含凭据、对话或计划；不是源码快照、写入授权或操作系统沙箱。</text></g></svg>