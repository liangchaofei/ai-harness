<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="735" viewBox="0 0 1080 735"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#64748b"/></marker></defs><rect width="1080" height="735" fill="#f8fafc"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="44" font-size="25" font-weight="700" fill="#172554">complete：上下文转换与停止原因保留</text><text x="30" y="78" font-size="16" fill="#475569">教学示例值，不是真实模型输出；Context、HTTP消息、AssistantMessage是不同形状。</text><path d="M495 210 L580 210" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M820 295 L820 350" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M585 435 L500 435" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M260 515 L260 575" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="125" width="465" height="170" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" /><text x="48" y="157" font-size="19" font-weight="700" fill="#0f172a">① 应用提供两类数据</text><text x="48" y="189" font-size="16" fill="#334155">Context: systemPrompt + 一条user消息</text><text x="48" y="216" font-size="16" fill="#334155">CompleteOptions: apiKey / model / maxTokens</text><text x="48" y="243" font-size="16" fill="#334155">配置不进入对话消息</text><text x="48" y="270" font-size="16" fill="#334155">原context.messages不被改写</text><rect x="585" y="125" width="465" height="170" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" /><text x="603" y="157" font-size="19" font-weight="700" fill="#0f172a">② DeepSeek适配 → fetch</text><text x="603" y="189" font-size="16" fill="#334155">将systemPrompt转成system消息</text><text x="603" y="216" font-size="16" fill="#334155">发送system + user两条消息</text><text x="603" y="243" font-size="16" fill="#334155">POST /chat/completions；非流式</text><text x="603" y="270" font-size="16" fill="#334155">输出上限由options映射到max_tokens</text><rect x="585" y="355" width="465" height="160" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" /><text x="603" y="387" font-size="19" font-weight="700" fill="#0f172a">③ response / value接住服务返回</text><text x="603" y="419" font-size="16" fill="#334155">HTTP或JSON失败 → 抛给入口</text><text x="603" y="446" font-size="16" fill="#334155">HTTP成功仍要检查JSON形状</text><text x="603" y="473" font-size="16" fill="#334155">finish_reason与message来自服务</text><text x="603" y="500" font-size="16" fill="#334155">截断length是生成结果，不是断网</text><rect x="30" y="355" width="465" height="160" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" /><text x="48" y="387" font-size="19" font-weight="700" fill="#0f172a">④ decodeMessage转换</text><text x="48" y="419" font-size="16" fill="#334155">检查choices[0]和assistant文本</text><text x="48" y="446" font-size="16" fill="#334155">stop → stopReason:stop</text><text x="48" y="473" font-size="16" fill="#334155">length → stopReason:length</text><text x="48" y="500" font-size="16" fill="#334155">本篇不支持的类型明确失败</text><rect x="30" y="580" width="1020" height="115" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" /><text x="48" y="612" font-size="19" font-weight="700" fill="#0f172a">⑤ message返回应用，由应用判断交付</text><text x="48" y="644" font-size="16" fill="#334155">{ role: &quot;assistant&quot;, content: &quot;空数组时…&quot;, stopReason: &quot;length&quot; }</text><text x="48" y="671" font-size="16" fill="#334155">先显示模型消息；length或空文本不交付为完整回答；stop也不代表任务验证通过</text></g></svg>