<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title desc">
<title id="title">草稿可以变化，只有终止后才交付完整消息</title><desc id="desc">下面并列两种协议的过程；它们最后产生相同的项目 done 事件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1080" height="790" fill="#f8fafc"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="28" font-weight="700">草稿可以变化，只有终止后才交付完整消息</text>
<text x="40" y="86" font-size="19" fill="#475569">下面并列两种协议的过程；它们最后产生相同的项目 done 事件。</text>
<rect x="40" y="118" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="152" font-size="23" font-weight="700">DeepSeek：按工具 index 拼接</text>
<text x="62" y="185" font-size="20">index 0：id = read_1；name = read_file；arguments 先收到 {&quot;path&quot;:。</text>
<text x="62" y="215" font-size="20">同 index 再追加 &quot;src/cart.ts&quot;}；finish_reason = tool_calls；最后 [DONE]。</text>

<rect x="40" y="268" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="302" font-size="23" font-weight="700">Anthropic：按块开始 / 增量 / 结束拼接</text>
<text x="62" y="335" font-size="20">message_start → text 块 → tool_use 块（id = read_1）。</text>
<text x="62" y="365" font-size="20">input_json_delta 累积 → block_stop → stop_reason = tool_use → message_stop。</text>

<rect x="40" y="418" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="452" font-size="23" font-weight="700">完整终止：统一检查并产出 done</text>
<text x="62" y="485" font-size="20">旧解码器检查身份与停止原因 → AssistantMessage。</text>
<text x="62" y="515" font-size="20">应用连接 return message → Runtime 保存一次 → 原门禁检查后执行工具。</text>

<rect x="40" y="568" width="1000" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text x="62" y="602" font-size="23" font-weight="700">缺少终止：不产出 done</text>
<text x="62" y="635" font-size="20">可能已经显示文字预览，但模型调用失败。</text>
<text x="62" y="665" font-size="20">不保存半条 assistant、不执行草稿工具；终端显示 failed。</text>
<text x="40" y="738" font-size="18" fill="#475569">截断只保留文本与 length，不交付动作草稿；不猜测或修复不完整 JSON。</text></g></svg>