<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-label="copyMessages：复制到哪一层？"><rect width="840" height="420" rx="18" fill="#f4f8fc"/><g fill="#142b48" font-family="system-ui,sans-serif"><text x="36" y="52" font-size="26" font-weight="bold">copyMessages：复制到哪一层？</text><rect x="36" y="80" width="768" height="84" rx="12" fill="#e0efff"/><text x="58" y="112" font-size="21" font-weight="bold">只展开数组：[...messages]</text><text x="58" y="141" font-size="18">数组不同；里面的 assistant 对象、toolCalls 和请求对象仍共享。</text><rect x="36" y="186" width="768" height="84" rx="12" fill="#dcf4e9"/><text x="58" y="218" font-size="21" font-weight="bold">本篇复制：消息 → toolCalls 数组 → 每个请求对象</text><text x="58" y="247" font-size="18">三个层次都创建新对象；字符串字段直接复制其值。</text><rect x="36" y="292" width="768" height="84" rx="12" fill="#fff0d6"/><text x="58" y="324" font-size="21" font-weight="bold">改副本的 toolCalls[0].arguments</text><text x="58" y="353" font-size="18">只改变本轮副本，完整记录中的原参数保持不变。</text></g></svg>
