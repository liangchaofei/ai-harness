<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="固定repair观察：4次模型，6项工具"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="520" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">固定repair观察：4次模型，6项工具</text><text x="32" y="72" font-size="15" fill="#52667d">动作由固定函数预先选择；文件内容与验收输出由实际程序产生。</text><path d="M450 155L510 155" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 225L710 310" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M510 355L450 355" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="32" y="110" width="418" height="102" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="48" y="140" font-size="16" fill="#182c45">第1次：读取入口和当前实现</text><text x="48" y="162" font-size="16" fill="#182c45">read_entry / read_current</text><text x="48" y="184" font-size="16" fill="#182c45">两项实际读取 → 历史</text><rect x="510" y="110" width="418" height="102" rx="10" fill="#fff0d3" stroke="#bac9d9"/><text x="526" y="140" font-size="16" fill="#182c45">第2次：部分修改并验收</text><text x="526" y="162" font-size="16" fill="#182c45">edit_partial / check_partial</text><text x="526" y="184" font-size="16" fill="#182c45">实际反馈：根路径仍失败</text><rect x="32" y="310" width="418" height="102" rx="10" fill="#e4f4eb" stroke="#bac9d9"/><text x="48" y="340" font-size="16" fill="#182c45">第4次：收到实际通过后回答</text><text x="48" y="362" font-size="16" fill="#182c45">Runtime返回answered</text><text x="48" y="384" font-size="16" fill="#182c45">inspect核对当前内容 → accepted:true</text><rect x="510" y="310" width="418" height="102" rx="10" fill="#e1efff" stroke="#bac9d9"/><text x="526" y="340" font-size="16" fill="#182c45">第3次：检查真实失败后修正</text><text x="526" y="362" font-size="16" fill="#182c45">edit_complete / check_complete</text><text x="526" y="384" font-size="16" fill="#182c45">实际反馈：八项通过</text><text x="32" y="496" font-size="15" fill="#52667d">真实服务可能采用不同动作和轮数；此图不表示模型已经自主完成迁移。</text></g></svg>