<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 207" role="img" aria-labelledby="title">
<title id="title">CLI 从参数分流到不同入口</title>
<defs><marker id="end" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#465470"/></marker></defs>
<rect width="880" height="207" rx="16" fill="#f3f5fa"/>
<g font-family="system-ui, PingFang SC, sans-serif" fill="#192642">
<text x="28" y="49" font-size="25" font-weight="700">CLI 从参数分流到不同入口</text>
<rect x="28" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="152" y="110" font-size="20" font-weight="700" text-anchor="middle">--gate-check</text><text x="152" y="135" font-size="15" text-anchor="middle">准备段移除 run_check</text><path d="M280 116 H310" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="316" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="440" y="110" font-size="20" font-weight="700" text-anchor="middle">--decide-check</text><text x="440" y="135" font-size="15" text-anchor="middle">只创建 .approval</text><path d="M568 116 H598" stroke="#465470" stroke-width="2" marker-end="url(#end)"/><rect x="604" y="80" width="248" height="71" rx="11" fill="#e8edff" stroke="#4d5db7" stroke-width="2"/><text x="728" y="110" font-size="20" font-weight="700" text-anchor="middle">--resume-check</text><text x="728" y="135" font-size="15" text-anchor="middle">先检查批准，再 claimCheck</text>
<text x="28" y="182" font-size="16">三个入口分属不同进程，决定进程和恢复进程都不构造模型。</text>
</g></svg>
