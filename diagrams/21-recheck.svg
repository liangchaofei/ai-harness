<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" role="img" aria-label="通过后再写入，为什么需要重验"><rect width="900" height="354" rx="16" fill="#f4f8fc"/><g font-family="system-ui,sans-serif" fill="#142b48"><text x="28" y="44" font-size="26" font-weight="700">通过后再写入，为什么需要重验</text><rect x="28" y="63" width="844" height="82" rx="10" fill="#e1efff"/><text x="48" y="94" font-size="21" font-weight="700">basic：最近验收通过</text><text x="48" y="123" font-size="18">latest.index = 1；无后续写入 → pending: null</text><rect x="28" y="156" width="844" height="82" rx="10" fill="#def3e9"/><text x="48" y="187" font-size="21" font-weight="700">stale：通过后追加写入反馈</text><text x="48" y="216" font-size="18">latestEdit.index = 2 &gt; 1 → pending: 重新运行验收</text><rect x="28" y="249" width="844" height="82" rx="10" fill="#fff0d6"/><text x="48" y="280" font-size="21" font-weight="700">malformed：最近验收无法解码</text><text x="48" y="309" font-size="18">latest.outcome = unknown → pending: 重新运行验收</text></g></svg>
