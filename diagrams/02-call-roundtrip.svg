<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1160" viewBox="0 0 1080 1160" role="img"><title>一次工具请求的调用、转换与返回</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#64748b"/></marker></defs><rect width="1080" height="1160" fill="#f8fafc"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="42" font-size="28" fill="#334155" font-weight="700">一次工具请求：从应用输入到两条日志</text><text x="30" y="78" font-size="20" fill="#334155">教学样本 call_01；原始结构为说明用途，不是真实服务抓包。</text><rect x="30" y="110" width="1020" height="132" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="143" font-size="23" fill="#334155" font-weight="700">① main.ts 创建输入，调用 complete</text><text x="50" y="180" font-size="20" fill="#334155">context.messages：请审查 src/cart.ts；context.tools：read_file 的说明</text><text x="50" y="211" font-size="20" fill="#334155">options：模型名 / 密钥 / 输出上限；还没有文件内容</text><path d="M540 242 L540 274" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="280" width="1020" height="132" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="313" font-size="23" fill="#334155" font-weight="700">② complete 构造请求，await fetch</text><text x="50" y="350" font-size="20" fill="#334155">将总体要求与任务转换为 messages；工具说明包装为 tools</text><text x="50" y="381" font-size="20" fill="#334155">HTTP正文交给服务；本地函数实现没有发送过去</text><path d="M540 412 L540 444" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="450" width="1020" height="132" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="483" font-size="23" fill="#334155" font-weight="700">③ 服务返回，response 与 value 先后接收</text><text x="50" y="520" font-size="20" fill="#334155">response：HTTP响应对象 → await response.json() → value：原始JSON</text><text x="50" y="551" font-size="20" fill="#334155">原始字段：finish_reason:tool_calls；message.tool_calls[0].id:call_01</text><path d="M540 582 L540 614" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="620" width="1020" height="132" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="653" font-size="23" fill="#334155" font-weight="700">④ decodeMessage 调用 decodeToolCalls</text><text x="50" y="690" font-size="20" fill="#334155">局部 message 仍是服务对象；动作数组交给 decodeToolCalls</text><text x="50" y="721" font-size="20" fill="#334155">生成 [{id:call_01, name:read_file, arguments:原始参数文本}]</text><path d="M540 752 L540 784" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="790" width="1020" height="132" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="823" font-size="23" fill="#334155" font-weight="700">⑤ 沿返回方向回到 main.ts 的 await</text><text x="50" y="860" font-size="20" fill="#334155">decodeMessage 创建 AssistantMessage → complete 返回 → 入口 message 接住</text><text x="50" y="891" font-size="20" fill="#334155">stopReason:toolUse；toolCalls[0].id:call_01；请求尚未执行</text><path d="M540 922 L540 954" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="960" width="1020" height="132" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="50" y="993" font-size="23" fill="#334155" font-weight="700">⑥ 两条日志消费同一份结果</text><text x="50" y="1030" font-size="20" fill="#334155">模型消息：打印整个 message；待执行工具请求：打印 toolCalls 中的一项</text><text x="50" y="1061" font-size="20" fill="#334155">一次模型调用、两条相关日志；没有工具执行，也没有自动写入历史</text><text x="30" y="1136" font-size="20" fill="#334155">类型定义形状；服务生成响应值；本地转换函数创建项目对象；应用只接收和展示。</text></g></svg>