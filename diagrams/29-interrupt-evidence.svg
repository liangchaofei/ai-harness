<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 263" role="img" aria-labelledby="title"><title id="title">CLI 退出与验收完成是两件事</title><rect width="600" height="263" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="32" font-size="22" font-weight="700">CLI 退出与验收完成是两件事</text><rect x="20" y="48" width="560" height="40" rx="8" fill="#e0edfc"/><text x="34" y="74" font-size="17">看到 .probe-started → 结束恢复 CLI</text><rect x="20" y="100" width="560" height="40" rx="8" fill="#e0f1e9"/><text x="34" y="126" font-size="17">确认 SIGKILL → 写入 .probe-release</text><rect x="20" y="152" width="560" height="40" rx="8" fill="#fff0d9"/><text x="34" y="178" font-size="17">子进程写出 0 → 正式 .done 仍然缺失</text><rect x="20" y="204" width="560" height="40" rx="8" fill="#e0edfc"/><text x="34" y="230" font-size="17">重试进入 claimCheck → 停止执行</text></g></svg>
