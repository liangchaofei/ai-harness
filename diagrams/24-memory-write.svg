<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title"><title id="title">完整 JSON 写好后才替换旧文件</title><rect width="600" height="280" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="36" font-size="22" font-weight="700">完整 JSON 写好后才替换旧文件</text><rect x="20" y="56" width="560" height="62" rx="9" fill="#e0edfc"/><text x="36" y="79" font-size="18" font-weight="700">JSON.stringify(updated)</text><text x="36" y="102" font-size="16">序列化全部笔记，并检查大小</text><rect x="20" y="128" width="560" height="62" rx="9" fill="#e0f1e9"/><text x="36" y="151" font-size="18" font-weight="700">writeFile(pending, text)</text><text x="36" y="174" font-size="16">在同目录下的暂存目录写入新文件</text><rect x="20" y="200" width="560" height="62" rx="9" fill="#fff0d9"/><text x="36" y="223" font-size="18" font-weight="700">rename(pending, capture.path)</text><text x="36" y="246" font-size="16">替换正式文件，最后清理暂存目录</text></g></svg>
