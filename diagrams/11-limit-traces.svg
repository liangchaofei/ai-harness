<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="同一任务：根据哪一项限制停止"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="540" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">同一任务：根据哪一项限制停止</text><text x="32" y="72" font-size="15" fill="#52667d">上方为时间示意，非精确比例；下方为工具额度 2、请求 3 项。</text><path d="M250 160L310 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M580 160L650 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M250 370L310 370" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M580 370L650 370" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="220" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">time：整次 200ms</text><text x="46" y="162" font-size="16" fill="#182c45">模型 1：约 30ms</text><text x="46" y="184" font-size="16" fill="#182c45">读 read_1 + 等待 40ms</text><rect x="310" y="110" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="326" y="140" font-size="16" fill="#182c45">模型 2：计划再等 400ms</text><text x="326" y="162" font-size="16" fill="#182c45">运行到期触发同一 signal</text><text x="326" y="184" font-size="16" fill="#182c45">保留此前两项结果</text><rect x="650" y="110" width="280" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="666" y="140" font-size="16" fill="#182c45">timedOut</text><text x="666" y="162" font-size="16" fill="#182c45">modelCalls: 2 / toolCalls: 2</text><text x="666" y="184" font-size="16" fill="#182c45">实际读取 1 次，无完整回答</text><rect x="30" y="320" width="220" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="350" font-size="16" fill="#182c45">tools：额度 2</text><text x="46" y="372" font-size="16" fill="#182c45">read_1 处理 → 计数 1</text><text x="46" y="394" font-size="16" fill="#182c45">read_2 处理 → 计数 2</text><rect x="310" y="320" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="326" y="350" font-size="16" fill="#182c45">read_3 申请时额度不足</text><text x="326" y="372" font-size="16" fill="#182c45">不发 tool_start，不执行</text><text x="326" y="394" font-size="16" fill="#182c45">此前两项结果带回循环</text><rect x="650" y="320" width="280" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="666" y="350" font-size="16" fill="#182c45">toolLimit</text><text x="666" y="372" font-size="16" fill="#182c45">modelCalls: 1 / toolCalls: 2</text><text x="666" y="394" font-size="16" fill="#182c45">实际读取 2 次，无下一轮</text><text x="32" y="516" font-size="15" fill="#52667d">固定模型只用于可重复观察；实际执行循环与文件读取不由装置代替。</text></g></svg>