<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="计划与实际执行：两份记录，各有用途"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">计划与实际执行：两份记录，各有用途</text><text x="32" y="72" font-size="15" fill="#52667d">应用选择开启计划；原模型接入、工具执行、历史与停止控制继续复用。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 212L250 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">应用：创建代码任务会话</text><text x="46" y="162" font-size="16" fill="#182c45">文件基线 / 实际验收来源</text><text x="46" y="184" font-size="16" fill="#182c45">与上一篇相同</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">应用：可选创建计划会话</text><text x="376" y="162" font-size="16" fill="#182c45">当前steps / revision</text><text x="376" y="184" font-size="16" fill="#182c45">tool加入清单，read留给展示</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">原runAgent分发工具请求</text><text x="706" y="162" font-size="16" fill="#182c45">update_plan / 代码工具</text><text x="706" y="184" font-size="16" fill="#182c45">循环等待实际结果</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">计划工具保存模型声明</text><text x="46" y="382" font-size="16" fill="#182c45">本地current替换成功</text><text x="46" y="404" font-size="16" fill="#182c45">tool返回保存后的快照</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">应用在tool_end读取计划</text><text x="376" y="382" font-size="16" fill="#182c45">整批结束后循环保存反馈</text><text x="376" y="404" font-size="16" fill="#182c45">下一轮模型从反馈读版本</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">停止后仍按15验收</text><text x="706" y="382" font-size="16" fill="#182c45">真实变化与对应通过结果</text><text x="706" y="404" font-size="16" fill="#182c45">完成清单不决定accepted</text><text x="32" y="506" font-size="15" fill="#52667d">计划不自动执行步骤、不替代文件证据；关闭后只保留原五个代码工具。</text></g></svg>