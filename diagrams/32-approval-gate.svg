<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 228" role="img"><title>从询问到执行的边界</title><rect width="670" height="228" rx="14" fill="#f4f8fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="18" y="32" font-size="21" font-weight="700">从询问到执行的边界</text><rect x="18" y="47" width="634" height="41" rx="8" fill="#dcebf9"/><text x="33" y="74" font-size="17">confirm 显示当前工具和参数</text><path d="M335 90v10m-4-4 4 4 4-4" fill="none" stroke="#48637b" stroke-width="2"/><rect x="18" y="102" width="634" height="41" rx="8" fill="#fcebcf"/><text x="33" y="129" font-size="17">yes 且未取消 → 原工具执行</text><path d="M335 145v10m-4-4 4 4 4-4" fill="none" stroke="#48637b" stroke-width="2"/><rect x="18" y="157" width="634" height="41" rx="8" fill="#dff0e7"/><text x="33" y="184" font-size="17">没有批准 → ToolExecutionError → 模型收到反馈</text></g></svg>
