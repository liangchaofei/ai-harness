<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="采集内容：范围、原文与内容标识"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">采集内容：范围、原文与内容标识</text><text x="32" y="72" font-size="15" fill="#52667d">每次重新扫描；范围不同则拒绝继续取证，要求重新准备会话。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 212L250 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">openWorkspace重新扫描</text><text x="46" y="162" font-size="16" fill="#182c45">固定root与extensions</text><text x="46" y="184" font-size="16" fill="#182c45">比对启动时文件清单</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">逐路径有界读取当前原文</text><text x="376" y="162" font-size="16" fill="#182c45">files：[路径,文本]数组</text><text x="376" y="184" font-size="16" fill="#182c45">读取失败则不返回半份快照</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">JSON.stringify(files)</text><text x="706" y="162" font-size="16" fill="#182c45">SHA-256 → revision</text><text x="706" y="184" font-size="16" fill="#182c45">原文不同则标识变化</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">baseline：启动时内容</text><text x="46" y="382" font-size="16" fill="#182c45">后续检查不覆盖基线</text><text x="46" y="404" font-size="16" fill="#182c45">不是恢复用检查点</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">current：停止后重新采集</text><text x="376" y="382" font-size="16" fill="#182c45">按同一路径比较文本</text><text x="376" y="404" font-size="16" fill="#182c45">相同文件不生成变化项</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">changes返回给应用</text><text x="706" y="382" font-size="16" fill="#182c45">path / before / after</text><text x="706" y="404" font-size="16" fill="#182c45">展示原文，不是Git补丁</text><text x="32" y="506" font-size="15" fill="#52667d">这是有限范围逐项采集，不是原子多文件快照；要求受控副本串行使用。</text></g></svg>