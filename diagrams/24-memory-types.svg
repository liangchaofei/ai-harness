<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title"><title id="title">三种对象分别交给谁</title><rect width="600" height="280" rx="14" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="20" y="36" font-size="22" font-weight="700">三种对象分别交给谁</text><rect x="20" y="56" width="560" height="62" rx="9" fill="#e0edfc"/><text x="36" y="79" font-size="18" font-weight="700">MemoryCapture</text><text x="36" y="102" font-size="16">配置给报告层：文件路径、主题、用例 /</text><rect x="20" y="128" width="560" height="62" rx="9" fill="#e0f1e9"/><text x="36" y="151" font-size="18" font-weight="700">MemoryNote</text><text x="36" y="174" font-size="16">写到磁盘：主题、提示、验收来源</text><rect x="20" y="200" width="560" height="62" rx="9" fill="#fff0d9"/><text x="36" y="223" font-size="18" font-weight="700">TaskMemory</text><text x="36" y="246" font-size="16">读取后交给模型：主题、文件名、提示</text></g></svg>
