<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="一次更新：通过检查，才替换当前计划"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">一次更新：通过检查，才替换当前计划</text><text x="32" y="72" font-size="15" fill="#52667d">模型提交expectedRevision / explanation / 完整steps；最多六项，一项进行中。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 212L250 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">检查字段与长度</text><text x="46" y="162" font-size="16" fill="#182c45">规范步骤首尾空白</text><text x="46" y="184" font-size="16" fill="#182c45">拒绝空白 / 重名 / 多进行中</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">预期序号与当前序号比较</text><text x="376" y="162" font-size="16" fill="#182c45">当前1，expected必须为1</text><text x="376" y="184" font-size="16" fill="#182c45">过期则返回已知失败</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">保存前检查取消</text><text x="706" y="162" font-size="16" fill="#182c45">current替换为revision2</text><text x="706" y="184" font-size="16" fill="#182c45">只有此处更新私有状态</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">返回快照的JSON文本</text><text x="46" y="382" font-size="16" fill="#182c45">原执行器关联请求ID</text><text x="46" y="404" font-size="16" fill="#182c45">循环保存后供下一轮使用</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">应用read取得深拷贝</text><text x="376" y="382" font-size="16" fill="#182c45">改副本不影响current</text><text x="376" y="404" font-size="16" fill="#182c45">每个运行单独创建会话</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">拒绝时旧状态保留</text><text x="706" y="382" font-size="16" fill="#182c45">已保存后取消不回滚</text><text x="706" y="404" font-size="16" fill="#182c45">不提供跨进程锁与恢复</text><text x="32" y="506" font-size="15" fill="#52667d">这里的revision是计划更新序号；不能和源码内容哈希比较，也不证明步骤真的完成。</text></g></svg>