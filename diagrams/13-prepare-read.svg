<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="准备和读取是两次不同的检查"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">准备和读取是两次不同的检查</text><text x="32" y="72" font-size="15" fill="#52667d">先限制可发现范围；每次执行时仍复查路径并有界读取。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M710 212L250 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300 380L360 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 380L690 380" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">准备：解析真实 root</text><text x="46" y="162" font-size="16" fill="#182c45">opendir 逐层访问</text><text x="46" y="184" font-size="16" fill="#182c45">256 目录项 / 6 层目录</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">跳过隐藏项、依赖与链接</text><text x="376" y="162" font-size="16" fill="#182c45">只收普通 .ts 文件</text><text x="376" y="184" font-size="16" fill="#182c45">超限则整个准备失败</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">保存路径索引</text><text x="706" y="162" font-size="16" fill="#182c45">相对路径 → 实际位置</text><text x="706" y="184" font-size="16" fill="#182c45">新增文件需重建工具</text><rect x="30" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="360" font-size="16" fill="#182c45">读取：从索引精确选择</text><text x="46" y="382" font-size="16" fill="#182c45">索引外路径反馈失败</text><text x="46" y="404" font-size="16" fill="#182c45">不使用模型路径拼磁盘地址</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">复查各级普通路径</text><text x="376" y="382" font-size="16" fill="#182c45">realpath 一致性检查</text><text x="376" y="404" font-size="16" fill="#182c45">最终文件 O_NOFOLLOW</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">readTextFile 有界读取</text><text x="706" y="382" font-size="16" fill="#182c45">源内容最多 16 KiB</text><text x="706" y="404" font-size="16" fill="#182c45">finally 关闭文件句柄</text><text x="32" y="506" font-size="15" fill="#52667d">常规链接被排除；检查到使用之间仍有竞争窗口，只用于受控练习材料。</text></g></svg>