<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="同一副本任务，接真实或固定模型"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466582"/></marker></defs><rect width="960" height="530" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="24" fill="#182c45" font-weight="700">同一副本任务，接真实或固定模型</text><text x="32" y="72" font-size="15" fill="#52667d">应用控制副本生命周期；Runtime 不知道 invoice 规则，也不选择验收脚本。</text><path d="M300 160L360 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M630 160L690 160" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M500 212L500 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M810 212L810 330" stroke="#466582" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="46" y="140" font-size="16" fill="#182c45">createRepairSession</text><text x="46" y="162" font-size="16" fill="#182c45">mkdtemp → cp → 配置工具</text><text x="46" y="184" font-size="16" fill="#182c45">保存 root / before / input</text><rect x="360" y="110" width="270" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="376" y="140" font-size="16" fill="#182c45">runRepair 选择 ModelCall</text><text x="376" y="162" font-size="16" fill="#182c45">真实连接或预写计划</text><text x="376" y="184" font-size="16" fill="#182c45">原 runAgent / 事件 / 预算</text><rect x="690" y="110" width="240" height="102" rx="10" fill="#e3f3ef" stroke="#bac9d9"/><text x="706" y="140" font-size="16" fill="#182c45">reportRepair 接停止结果</text><text x="706" y="162" font-size="16" fill="#182c45">读取副本 after</text><text x="706" y="184" font-size="16" fill="#182c45">展示 before / after / check</text><rect x="360" y="330" width="270" height="102" rx="10" fill="#e3eeff" stroke="#bac9d9"/><text x="376" y="360" font-size="16" fill="#182c45">准备失败清理半成品</text><text x="376" y="382" font-size="16" fill="#182c45">运行后保留副本供审阅</text><text x="376" y="404" font-size="16" fill="#182c45">finally 移除 SIGINT 监听</text><rect x="690" y="330" width="240" height="102" rx="10" fill="#fff0db" stroke="#bac9d9"/><text x="706" y="360" font-size="16" fill="#182c45">readyForReview 仅为线索</text><text x="706" y="382" font-size="16" fill="#182c45">未绑定最终版本的通过记录</text><text x="706" y="404" font-size="16" fill="#182c45">不自动写回原项目</text><text x="32" y="506" font-size="15" fill="#52667d">验收脚本是配套任务材料；状态与版本对应将在下一单元完善。</text></g></svg>