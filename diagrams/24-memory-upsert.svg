<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-labelledby="title"><title id="title">同一个主题怎样保存</title><rect width="660" height="270" rx="16" fill="#f3f7fb"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="39" font-size="23" font-weight="700">同一个主题怎样保存</text><rect x="24" y="60" width="612" height="40" rx="8" fill="#e0edfc"/><text x="40" y="86" font-size="17">没有 route-repair → 追加 next</text><rect x="24" y="109" width="612" height="40" rx="8" fill="#e0f1e9"/><text x="40" y="135" font-size="17">同主题且证据一致 → unchanged</text><rect x="24" y="158" width="612" height="40" rx="8" fill="#fff0d9"/><text x="40" y="184" font-size="17">同主题有新证据 → 替换原位置</text><rect x="24" y="207" width="612" height="40" rx="8" fill="#e0edfc"/><text x="40" y="233" font-size="17">同主题已停用 → disabled</text></g></svg>
